<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Office | Staffify</title>
    <meta name="description" content="Live view of the AI workforce running Staffify's operations layer.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/icon.svg">
    <link rel="apple-touch-icon" href="/assets/brand/icon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/ux.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --c: #1abde1; --c2: #0fa3c5; --c3: #0d82b8; --c4: #1456a4;
            --black: #000; --near-black: #0a0a0a; --card: #0d0d0d; --card2: #131318;
            --subtle: #6e6e73; --muted: #a1a1a6;
            --divider: rgba(255,255,255,0.08);
            --white: #ffffff;
            --green: #34d399; --amber: #fbbf24; --gray: #6b7280;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #050507; color: var(--white);
            line-height: 1.55;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background:
                radial-gradient(60% 50% at 20% 10%, rgba(26,189,225,0.10) 0%, transparent 50%),
                radial-gradient(50% 50% at 90% 90%, rgba(20,86,164,0.10) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Top bar */
        .topbar {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 32px;
            background: rgba(5,5,7,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--divider);
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand img { height: 24px; display: block; }
        .brand-sep {
            width: 1px; height: 18px; background: rgba(255,255,255,0.15);
        }
        .brand-title {
            font-size: 13px; font-weight: 600; color: var(--muted);
            letter-spacing: 0.02em;
        }
        .live-pulse {
            display: inline-flex; align-items: center; gap: 8px;
            font-size: 12px; font-weight: 600; color: var(--muted);
            letter-spacing: 0.08em; text-transform: uppercase;
        }
        .live-pulse-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
            animation: livePulse 2s ease-in-out infinite;
        }
        @keyframes livePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
            50%      { box-shadow: 0 0 0 8px rgba(52, 211, 153, 0); }
        }

        /* Page header */
        .page {
            max-width: 1200px; margin: 0 auto;
            padding: 56px 32px 80px;
            position: relative; z-index: 1;
        }
        .page-eyebrow {
            font-size: 11px; font-weight: 700; letter-spacing: 0.22em;
            text-transform: uppercase; color: var(--c);
            margin-bottom: 18px;
        }
        .page-title {
            font-size: clamp(34px, 5vw, 52px);
            font-weight: 900; letter-spacing: -0.03em;
            line-height: 1.05;
            margin-bottom: 18px;
        }
        .page-title em {
            font-style: normal;
            background: linear-gradient(90deg, #1abde1 0%, #0fa3c5 60%, #1456a4 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .page-dek {
            font-size: 16px; color: var(--muted);
            max-width: 560px; line-height: 1.6;
            margin-bottom: 36px;
        }
        .updated {
            font-size: 12px; color: var(--subtle);
            margin-bottom: 36px; font-variant-numeric: tabular-nums;
        }

        /* Grid */
        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 18px;
        }

        .member {
            background: linear-gradient(180deg, var(--card2) 0%, var(--card) 100%);
            border: 1px solid var(--divider);
            border-radius: 18px;
            padding: 24px;
            display: grid;
            grid-template-columns: 72px 1fr;
            gap: 18px;
            align-items: start;
            transition: border-color .25s, transform .25s, box-shadow .25s;
            position: relative;
            overflow: hidden;
        }
        .member:hover {
            border-color: rgba(26,189,225,0.30);
            transform: translateY(-2px);
            box-shadow: 0 18px 50px rgba(0,0,0,0.4), 0 0 0 1px rgba(26,189,225,0.12);
        }
        .member-working {
            border-color: rgba(52, 211, 153, 0.32);
        }
        .member-working::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(52,211,153,0.06), transparent);
            background-size: 200% 100%;
            animation: workingShimmer 2.4s linear infinite;
            pointer-events: none;
        }
        @keyframes workingShimmer {
            from { background-position: 200% 0; }
            to   { background-position: -200% 0; }
        }

        /* Avatar */
        .avatar-wrap {
            position: relative;
            width: 72px; height: 72px;
        }
        .avatar {
            width: 72px; height: 72px;
            border-radius: 50%;
            object-fit: cover;
            background: var(--near-black);
            display: block;
        }
        .avatar-fallback {
            width: 72px; height: 72px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #1a2a44, #0d82b8);
            color: var(--white); font-weight: 800; font-size: 24px;
            letter-spacing: -0.02em;
        }
        .status-dot {
            position: absolute; bottom: 2px; right: 2px;
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid var(--card);
            background: var(--gray);
        }
        .status-dot.working {
            background: var(--green);
            box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6);
            animation: dotPulse 1.6s ease-in-out infinite;
        }
        .status-dot.on-shift { background: var(--green); opacity: 0.7; }
        .status-dot.idle     { background: var(--gray); }
        @keyframes dotPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.6); }
            50%      { box-shadow: 0 0 0 6px rgba(52, 211, 153, 0); }
        }

        .member-body { min-width: 0; }
        .member-name {
            font-size: 17px; font-weight: 700; color: var(--white);
            letter-spacing: -0.01em; margin-bottom: 2px;
            display: flex; align-items: center; gap: 8px;
        }
        .member-role {
            font-size: 12px; color: var(--c); font-weight: 600;
            letter-spacing: 0.02em; margin-bottom: 4px;
        }
        .member-team {
            display: inline-block;
            font-size: 10px; font-weight: 700;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--muted); padding: 3px 9px;
            border: 1px solid var(--divider); border-radius: 999px;
            margin-bottom: 14px;
        }
        .member-status {
            font-size: 13px; color: var(--muted);
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 8px;
        }
        .member-status .label-working { color: var(--green); font-weight: 600; }
        .member-status .label-on-shift { color: var(--green); opacity: 0.85; }
        .member-status .label-idle { color: var(--subtle); }

        .member-action {
            font-size: 12px; color: var(--white);
            background: rgba(26,189,225,0.05);
            border: 1px solid rgba(26,189,225,0.12);
            border-radius: 8px;
            padding: 8px 10px;
            margin-bottom: 10px;
            font-family: 'SF Mono', Menlo, monospace;
            line-height: 1.5;
            word-break: break-word;
        }

        .member-stats {
            display: flex; gap: 14px;
            font-size: 11px; color: var(--subtle);
            font-variant-numeric: tabular-nums;
            margin-top: 6px;
        }
        .member-stats strong {
            color: var(--white); font-weight: 700;
        }
        .member-resp {
            font-size: 11px; color: var(--subtle);
            line-height: 1.55;
            border-top: 1px dashed var(--divider);
            padding-top: 12px; margin-top: 12px;
        }

        /* Team header */
        .team-section { margin-bottom: 36px; }
        .team-header {
            display: flex; align-items: baseline; gap: 14px;
            margin-bottom: 18px;
        }
        .team-header h2 {
            font-size: 13px; font-weight: 700;
            letter-spacing: 0.18em; text-transform: uppercase;
            color: var(--muted);
        }
        .team-header-rule {
            flex: 1; height: 1px; background: var(--divider);
        }

        @media (max-width: 700px) {
            .topbar { padding: 14px 18px; }
            .brand-title { display: none; }
            .page { padding: 36px 18px 60px; }
            .team-grid { grid-template-columns: 1fr; }
            .member { padding: 20px; gap: 14px; grid-template-columns: 60px 1fr; }
            .avatar-wrap, .avatar, .avatar-fallback { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>

<header class="topbar">
    <div class="brand">
        <a href="/" aria-label="Staffify"><img src="/assets/brand/logo-white.svg" alt="Staffify"></a>
        <span class="brand-sep"></span>
        <span class="brand-title">Virtual Office</span>
    </div>
    <div class="live-pulse">
        <span class="live-pulse-dot"></span>
        <span>Live</span>
    </div>
</header>

<main class="page" id="content">
    <div class="page-eyebrow">Always-On Operations</div>
    <h1 class="page-title">The team that never <em>sleeps.</em></h1>
    <p class="page-dek">Live view of the agents running Staffify's automation layer. Each one has a job, a schedule, and a heartbeat.</p>
    <div class="updated" id="updated">Loading…</div>

    <div id="team-root"></div>
</main>

<script>
(function(){
    var root = document.getElementById('team-root');
    var updated = document.getElementById('updated');

    function avatarHTML(member) {
        var initials = (member.name || '?').slice(0, 2).toUpperCase();
        return '<div class="avatar-wrap">' +
            '<img class="avatar" src="' + member.avatar + '" alt="' + member.name + '" ' +
            'onerror="this.style.display=\'none\'; this.nextElementSibling.style.display=\'flex\';">' +
            '<div class="avatar-fallback" style="display:none;">' + initials + '</div>' +
            '<div class="status-dot ' + member.status.state + '"></div>' +
            '</div>';
    }

    function memberHTML(m) {
        var workingClass = m.status.state === 'working' ? ' member-working' : '';
        var labelClass = 'label-' + m.status.state;
        var actionBlock = m.last_action ? '<div class="member-action">' + escapeHtml(m.last_action) + '</div>' : '';
        var statsBlock = (m.count_today || m.count_total) ?
            '<div class="member-stats">' +
                '<span><strong>' + (m.count_today || 0) + '</strong> today</span>' +
                '<span><strong>' + (m.count_total || 0) + '</strong> all-time</span>' +
                '<span>' + escapeHtml(m.cron) + '</span>' +
            '</div>' :
            '<div class="member-stats"><span>' + escapeHtml(m.cron) + '</span></div>';

        return '<div class="member' + workingClass + '">' +
            avatarHTML(m) +
            '<div class="member-body">' +
                '<div class="member-name">' + escapeHtml(m.name) + '</div>' +
                '<div class="member-role">' + escapeHtml(m.role) + '</div>' +
                '<div class="member-team">' + escapeHtml(m.team) + '</div>' +
                '<div class="member-status">' +
                    '<span class="' + labelClass + '">' + escapeHtml(m.status.label) + '</span>' +
                '</div>' +
                actionBlock +
                statsBlock +
                '<div class="member-resp">' + escapeHtml(m.responsibilities) + '</div>' +
            '</div>' +
        '</div>';
    }

    function escapeHtml(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    function groupByTeam(team) {
        var groups = {};
        team.forEach(function(m){
            if (!groups[m.team]) groups[m.team] = [];
            groups[m.team].push(m);
        });
        return groups;
    }

    function render(data) {
        var groups = groupByTeam(data.team);
        var html = '';
        Object.keys(groups).forEach(function(teamName){
            html += '<section class="team-section">' +
                '<div class="team-header"><h2>' + teamName + '</h2><div class="team-header-rule"></div></div>' +
                '<div class="team-grid">' +
                    groups[teamName].map(memberHTML).join('') +
                '</div>' +
            '</section>';
        });
        root.innerHTML = html;
        var t = new Date(data.generated_at);
        updated.textContent = 'Last updated ' + t.toLocaleTimeString() + ' · refreshes every 30s';
    }

    function load() {
        fetch('/api/office-status/')
            .then(function(r){ return r.json(); })
            .then(render)
            .catch(function(){ updated.textContent = 'Could not load status'; });
    }

    load();
    setInterval(load, 30000);
})();
</script>
</body>
</html>
