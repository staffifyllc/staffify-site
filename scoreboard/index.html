<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance · Staffify Sales</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#050507; --white:#fff; --cyan:#1abde1; --cyan-hi:#5fe0fa; --cyan-dark: #0d82b8; --muted:#9ba1ab; --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.09); --green-hi:#7ef5c2; }
        .grad { background: linear-gradient(100deg, var(--cyan-hi) 0%, var(--cyan) 45%, var(--cyan-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; }
        .eyebrow::before { content: ''; width: 30px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
        .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); border: 1px solid rgba(26,189,225,0.4); background: rgba(26,189,225,0.08); border-radius: 999px; padding: 6px 14px; }
        .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
        body { font-family:"Inter",-apple-system,sans-serif; background: radial-gradient(1000px 600px at 90% -5%, rgba(26,189,225,0.08), transparent 60%), radial-gradient(800px 600px at -10% 40%, rgba(13,86,164,0.10), transparent 55%), var(--bg); color:var(--white); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
        .topbar { position:sticky; top:0; z-index:10; background:rgba(5,5,7,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); padding:12px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .topbar img { height:22px; }
        .nav { display:flex; gap:5px; flex-wrap:wrap; }
        .nav a { font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; padding:7px 13px; border-radius:999px; }
        .nav a.active { color:var(--cyan-hi); background:rgba(26,189,225,0.10); }
        @media (max-width: 880px) { .topbar { flex-wrap: wrap; } .nav { order: 3; flex-basis: 100%; justify-content: center; margin-top: 6px; } }
        .tb-right { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); }
        .btn { font-size:13px; font-weight:700; color:#04222b; background:var(--cyan); border:none; border-radius:999px; padding:8px 15px; cursor:pointer; text-decoration:none; }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--card-border); }
        .wrap { max-width:880px; margin:0 auto; padding:26px 22px; }
        h1 { font-size:26px; font-weight:900; letter-spacing:-0.02em; margin-bottom:2px; }
        .sub { font-size:13.5px; color:var(--muted); margin-bottom:22px; }
        .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
        @media (max-width:640px){ .cards { grid-template-columns:1fr 1fr; } }
        .metric { background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px 18px; }
        .metric .lbl { font-size:11.5px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase; color:var(--muted); }
        .metric .n { font-size:32px; font-weight:900; letter-spacing:-0.02em; margin-top:4px; }
        .metric .x { font-size:12px; color:var(--cyan-hi); margin-top:2px; }
        .conv { display:flex; gap:22px; margin:6px 0 26px; font-size:13px; color:var(--muted); }
        .conv b { color:var(--white); font-weight:800; }
        .lbl2 { font-size:12px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--cyan); margin:22px 0 12px; display: flex; align-items: center; gap: 12px; }
        .lbl2::before { content: ''; width: 30px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
        .lead-row { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px 16px; margin-bottom:9px; }
        .rank { font-size:14px; font-weight:900; color:var(--cyan); width:22px; }
        .rname { flex:1; font-size:15px; font-weight:700; }
        .rstat { font-size:13px; color:var(--muted); } .rstat b { color:var(--white); }
        .empty { color:var(--muted); font-size:14px; padding:20px 2px; }
        .comp { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:20px 22px; margin-top:8px; }
        .comp .cr { display:flex; align-items:baseline; gap:12px; padding:12px 0; border-bottom:1px solid rgba(255,255,255,0.06); flex-wrap:wrap; }
        .comp .cr:last-child { border-bottom:none; }
        .comp .pay { font-size:20px; font-weight:900; color:var(--green-hi); white-space:nowrap; min-width:120px; }
        .comp .desc { flex:1; min-width:200px; font-size:14px; color:#414146; } .comp .desc b { color:#1d1d1f; }
        .gate { max-width:440px; margin:70px auto; background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:32px 28px; text-align:center; }
        .gate h2 { font-size:20px; font-weight:800; margin-bottom:8px; } .gate p { color:var(--muted); font-size:14px; margin-bottom:18px; }
        .gate input { width:100%; font-family:inherit; font-size:15px; color:var(--white); background:rgba(255,255,255,0.05); border:1.5px solid var(--card-border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
        .gate .btn { width:100%; padding:13px; }
        /* Performance tabs and the Caller review (portal look: light, #0071e3 accent). */
        body .perf-head, body #app.wrap, body #review.wrap, body #live.wrap { max-width:1040px; margin-left:auto; margin-right:auto; }
        body .perf-head { padding:24px 28px 0; }
        body #app.wrap, body #review.wrap, body #live.wrap { padding:20px 28px 80px; }
        @media (max-width:700px){ body .perf-head { padding:20px 16px 0; } body #app.wrap, body #review.wrap, body #live.wrap { padding:16px 16px 60px; } }
        .perf-title { font-size:28px; font-weight:650; letter-spacing:-0.02em; color:#1d1d1f; margin:0 0 12px; }
        .perf-h2 { font-size:22px; font-weight:800; margin-bottom:2px; }
        .perf-tabs { display:flex; gap:22px; border-bottom:1px solid #e5e5ea; }
        body .perf-tab { background:none; border:0; border-bottom:2px solid transparent; border-radius:0; box-shadow:none; min-height:0; padding:10px 0 9px; margin-bottom:-1px; font:inherit; font-size:14.5px; font-weight:600; color:#6e6e73; cursor:pointer; }
        body .perf-tab:hover { background:none; color:#1d1d1f; }
        body .perf-tab.on { color:#1d1d1f; border-bottom-color:#0071e3; background:none; }
        body .perf-tab:focus-visible { outline:2px solid #0071e3; outline-offset:3px; border-radius:4px; }
        .pr-ctl { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin:4px 0 16px; }
        .pr-field { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#6e6e73; font-weight:600; }
        body .pr-field select, body .pr-field input { min-height:38px; padding:7px 10px; font-size:14px; }
        .pr-presets { display:flex; gap:6px; flex-wrap:wrap; }
        body .pr-preset { min-height:38px; padding:7px 12px; font-size:13px; }
        .pr-meta { font-size:13px; color:#6e6e73; line-height:1.6; margin:0 0 12px; }
        .pr-meta b { color:#1d1d1f; font-weight:600; }
        .pr-note { font-size:13px; line-height:1.55; background:#f5f7fa; border:1px solid #e5e5ea; border-radius:10px; padding:10px 12px; margin:0 0 8px; color:#414146; }
        .pr-coverage { margin:0 0 16px; padding-left:18px; font-size:12.5px; line-height:1.55; color:#6e6e73; display:grid; gap:3px; max-width:90ch; }
        .pr-empty { color:#6e6e73; font-size:14px; background:#fafafa; border-radius:12px; padding:18px; }
        .pr-tiles { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin:16px 0; }
        @media (max-width:760px){ .pr-tiles { grid-template-columns:1fr 1fr; } }
        .pr-tile { background:#fff; border:1px solid #e5e5ea; border-radius:14px; padding:14px 16px; }
        .pr-tile b { display:block; font-size:28px; font-weight:650; letter-spacing:-0.6px; color:#1d1d1f; font-variant-numeric:tabular-nums; }
        .pr-tile span { display:block; font-size:13px; color:#1d1d1f; }
        .pr-tile em { display:block; font-style:normal; font-size:12px; color:#6e6e73; margin-top:2px; line-height:1.4; }
        .pr-sec { background:#fff; border:1px solid #e5e5ea; border-radius:14px; padding:16px 18px; margin:0 0 14px; }
        .pr-sec h2 { font-size:16px; font-weight:650; color:#1d1d1f; margin:0 0 8px; }
        .pr-sub h3 { font-size:13px; font-weight:650; color:#414146; margin:16px 0 6px; }
        .pr-lede { font-size:14px; color:#1d1d1f; line-height:1.55; margin:0 0 10px; max-width:70ch; }
        .pr-small { font-size:12.5px; color:#6e6e73; line-height:1.5; margin:10px 0 0; }
        .pr-scroll { overflow-x:auto; }
        body table.pr-table { width:100%; border-collapse:collapse; font-size:13.5px; }
        body table.pr-table th { font-size:11.5px; letter-spacing:.6px; text-transform:uppercase; color:#6e6e73; font-weight:650; text-align:left; padding:8px 10px; border-bottom:1px solid #e5e5ea; white-space:nowrap; }
        body table.pr-table td { padding:8px 10px; border-bottom:1px solid #f0f0f3; vertical-align:top; color:#1d1d1f; font-variant-numeric:tabular-nums; }
        body table.pr-table tfoot td { font-weight:650; border-top:1px solid #e5e5ea; border-bottom:0; }
        body table.pr-table tbody tr:last-child td { border-bottom:0; }
        table.pr-hours td:last-child { width:70%; }
        .pr-barwrap { display:flex; align-items:center; gap:8px; }
        .pr-bar { display:inline-block; height:10px; min-width:2px; background:#0071e3; border-radius:3px; }
        .pr-barn { font-size:12.5px; color:#414146; }
        .pr-more { margin:12px 0 0; }
        .pr-defs dl { display:grid; grid-template-columns:minmax(140px,220px) 1fr; gap:6px 16px; font-size:13px; color:#414146; }
        .pr-defs dt { font-weight:600; color:#1d1d1f; }
        .pr-defs dd { margin:0; }
        @media (max-width:560px){ .pr-defs dl { grid-template-columns:1fr; } .perf-tabs { gap:16px; } }
    </style>

<link rel="stylesheet" href="/assets/css/portal.css?v=20261013"><script defer src="/assets/js/portal-shell.js?v=20261013"></script></head>
<body>

<header class="topbar">
    <img src="/assets/brand/logo-blue.svg" alt="Staffify">
    <nav class="nav">
        <a href="/hub/">Hub</a>
        <a href="/my-day/">My Day</a>
        <a href="/dialer/">Dialer</a>
        <a href="/scoreboard/" class="active">Scoreboard</a>
        <a href="/pipeline/">Pipeline</a><a href="/commissions/">Commissions</a>
        <a href="/training/sales/">Training</a>
        <a href="/careers/sales/inbox/">Applicants</a>
        <a href="https://recruiting.gostaffify.com/dashboard" target="_blank" rel="noopener" style="border:1px solid var(--card-border); margin-left:8px;">Talent Console &#8599;</a>
    </nav>
    <div class="tb-right" id="tbRight"></div>
</header>

<div class="perf-head">
    <h1 class="perf-title">Performance</h1>
    <div class="perf-tabs" role="tablist" aria-label="Performance views">
        <button type="button" class="perf-tab" id="tab-live" role="tab" aria-controls="live" aria-selected="false" tabindex="-1" hidden>Right now</button>
        <button type="button" class="perf-tab on" id="tab-today" role="tab" aria-controls="app" aria-selected="true">Today</button>
        <button type="button" class="perf-tab" id="tab-review" role="tab" aria-controls="review" aria-selected="false" tabindex="-1">Caller review</button>
    </div>
</div>

<div class="wrap" id="live" role="tabpanel" aria-labelledby="tab-live" hidden></div>
<div class="wrap" id="app" role="tabpanel" aria-labelledby="tab-today"></div>
<div class="wrap pr-wrap" id="review" role="tabpanel" aria-labelledby="tab-review" hidden></div>
<script type="module" src="/assets/js/performance-review.js?v=202610272"></script>

<script>
(function(){
  var app=document.getElementById('app'), tbRight=document.getElementById('tbRight'), ME=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function pct(a,b){b=Number(b)||0; if(!b)return '0%'; return Math.round(100*(Number(a)||0)/b)+'%';}
  function repGet(){try{var r=JSON.parse(localStorage.getItem('sfy_rep')||'null');if(r&&r.name)return r;}catch(e){}return null;}
  function repSet(n){n=(n||'').trim();if(!n)return null;var em=n.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/(^\.|\.$)/g,'')+'@rep.local';var r={name:n,email:em};try{localStorage.setItem('sfy_rep',JSON.stringify(r));}catch(x){}return r;}
  function nameChip(){var r=repGet();return '<button class="btn btn-ghost" id="nm">'+(r?('Hi, '+esc(r.name.split(' ')[0])):'Set your name')+'</button>';}
  function wireChip(){var b=document.getElementById('nm');if(b)b.onclick=function(){var r=repGet();var n=prompt('Your name (shows on the scoreboard):',r?r.name:'');if(n){repSet(n);boot();}};}



  async function boot(){
    app.innerHTML='<div class="empty">Loading the scoreboard...</div>';
    ME=repGet();
    tbRight.innerHTML=nameChip(); wireChip();
    var s=null, code=0; try{ var r=await fetch('/api/call-queue/?action=scoreboard',{cache:'no-store'}); code=r.status; if(r.ok) s=await r.json(); }catch(e){}
    if(code===401){app.innerHTML='<div class="empty">Sign in to your Staffify account to see call reporting.</div>';return;}
    if(!s){app.innerHTML='<div class="empty">Call reporting is unavailable. Refresh to try again. No zero totals are assumed.</div>';return;}
    render(s);
    loadQuo();
  }

  // What the phone system itself recorded, which is a different number from the dispositions above.
  // A dial with no disposition logged still happened; a disposition logged without a dial did not.
  // Seeing both side by side is the point, so they are never added together.
  async function loadQuo(){
    var box=document.getElementById('quo'); if(!box) return;
    var d=null, code=0;
    try{
      // Paul and Madison get the whole team; a rep gets their own line and nothing else.
      var r=await fetch('/api/quo-activity/?team=1',{cache:'no-store'}); code=r.status;
      if(r.status===403){ r=await fetch('/api/quo-activity/',{cache:'no-store'}); code=r.status; }
      d=await r.json();
      if(!r.ok) d={ error:(d&&d.error)||('Quo returned '+r.status), detail:d&&d.detail };
    }catch(e){ d={ error:'Quo could not be reached.', detail:String(e&&e.message||e) }; }
    if(code===401){ box.innerHTML=''; return; }   // not signed in: show nothing rather than zeros
    if(!d||d.error){
      box.innerHTML='<div class="lbl2">Dialled in Quo</div><div class="empty">'+esc((d&&d.error)||'Quo could not be read.')+' This is not a count of zero calls.'+((d&&d.detail)?' <span style="opacity:.6">'+esc(d.detail)+'</span>':'')+'</div>';
      return;
    }
    var reps=d.reps||[];
    var rows=reps.length?reps.map(function(x,i){
      var mins=(x.talkMinutes!=null?x.talkMinutes:0);
      return '<div class="lead-row"><div class="rank">'+(i+1)+'</div><div class="rname">'+esc(x.rep&&x.rep.name||'Rep')+'</div>'+
        '<div class="rstat">Dials <b>'+(x.dials||0)+'</b>'+
        (x.uniqueNumbers!=null?' to <b>'+x.uniqueNumbers+'</b> numbers':'')+
        ' &middot; Talk <b>'+mins+' min</b>'+
        (x.truncated?' &middot; <span style="opacity:.6">partial</span>':'')+'</div></div>';
    }).join(''):'<div class="empty">Nobody has dialled through Quo in this window.</div>';
    box.innerHTML='<div class="lbl2">Dialled in Quo &middot; '+esc(d.window&&d.window.from||'')+(d.window&&d.window.to!==d.window.from?' to '+esc(d.window.to):'')+'</div>'+
      rows+
      '<p class="sub" style="margin-top:10px">'+esc(d.caveat||'')+' Counted separately from the dispositions above, never added to them. '+
      'Quo counts a call as answered when voicemail or a phone menu picks up, so that count is not shown. The Caller review tab shows who actually answered, from logged outcomes and notes.</p>';
  }

  function render(s){
    s=s||{}; var t=s.total||{};
    var target=Number(s.target)||100;
    var reps=(s.reps||[]).slice().sort(function(a,b){return (Number(b.dials||b.calls||0))-(Number(a.dials||a.calls||0));});

    var cards=
      '<div class="cards">'+
        '<div class="metric"><div class="lbl">Dials</div><div class="n">'+(t.dials||0)+'</div><div class="x">'+pct(t.dials,target)+' of '+target+' goal</div></div>'+
        '<div class="metric"><div class="lbl">Answers</div><div class="n">'+(t.answers||0)+'</div><div class="x">'+pct(t.answers,t.dials)+' pickup</div></div>'+
        '<div class="metric"><div class="lbl">Interested</div><div class="n">'+(t.interested||0)+'</div><div class="x">'+pct(t.interested,t.answers)+' of answers</div></div>'+
        '<div class="metric"><div class="lbl">Callbacks</div><div class="n">'+(t.callbacks||0)+'</div><div class="x">set for later</div></div>'+
      '</div>';

    var board;
    if(!reps.length){
      board='<div class="empty">No calls logged yet today. Rep numbers appear here the moment someone starts dialing.</div>';
    } else {
      board=reps.map(function(r,i){
        return '<div class="lead-row"><div class="rank">'+(i+1)+'</div><div class="rname">'+esc(r.rep||r.name||'Rep')+'</div>'+
          '<div class="rstat">Dials <b>'+(r.dials||r.calls||0)+'</b> &middot; Answers <b>'+(r.answers||0)+'</b> &middot; Interested <b>'+(r.interested||0)+'</b></div></div>';
      }).join('');
    }



    app.innerHTML=
      '<div class="eyebrow">Live Numbers</div><h2 class="perf-h2"><span class="grad">Scoreboard</span></h2><div class="sub">'+esc(s.date||'today')+' &middot; live from the call log</div>'+
      cards+
      '<div class="conv"><span>Pickup rate <b>'+pct(t.answers,t.dials)+'</b></span><span>Interest rate <b>'+pct(t.interested,t.answers)+'</b></span></div>'+
      '<div class="lbl2">Rep leaderboard</div>'+board+
      '<div id="quo"></div>'+
      '<p><a class="btn" href="/commissions/">View your commissions and payroll</a></p>';
  }

  boot();
})();
</script>
</body>
</html>
