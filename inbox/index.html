<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox · Staffify Sales</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="stylesheet" href="/assets/css/portal.css?v=20261013">
<style>
  .ib-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 16px}
  .ib-head h1{margin:0}
  .ib-sub{font-size:13.5px;color:#6e6e73;margin:4px 0 0}
  .ib-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .ib-controls button,.ib-controls a.btn{min-height:38px;padding:7px 14px;font-size:13.5px}
  .ib-controls button[aria-pressed="true"]{background:#1d1d1f;color:#fff;border-color:#1d1d1f}
  .ib-note{font-size:13.5px;color:#6e6e73;line-height:1.55;max-width:680px}
  .ib-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
  @media(min-width:960px){.ib-grid{grid-template-columns:380px minmax(0,1fr)}}
  .ib-list{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:6px;display:grid;gap:2px;min-width:0}
  .ib-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 10px;align-items:start;text-align:left;width:100%;padding:11px 12px;border:0;border-radius:12px;background:transparent;color:#1d1d1f;font:inherit;cursor:pointer;min-height:0}
  .ib-row:hover,.ib-row:focus-visible{background:#f2f6fb;outline:none}
  .ib-row[aria-current="true"]{background:#e8f0fb}
  .ib-dot{width:8px;height:8px;border-radius:50%;margin-top:6px;background:transparent}
  .ib-row.unread .ib-dot{background:#0071e3}
  .ib-who{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-row.unread .ib-who{font-weight:700}
  .ib-when{font-size:12px;color:#6e6e73;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ib-line{grid-column:2/4;font-size:13px;color:#414146;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ib-row.unread .ib-line.subj{color:#1d1d1f;font-weight:600}
  .ib-chip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;background:#eef3f8;color:#415971;font-size:11.5px;font-weight:600;vertical-align:1px}
  .ib-mine{color:#6e6e73;font-size:12px}
  .ib-thread{background:#fff;border:1px solid #e5e5ea;border-radius:16px;padding:20px 22px;min-width:0;display:grid;gap:14px}
  .ib-thread h2{font-size:19px;margin:0;letter-spacing:-.2px;overflow-wrap:anywhere}
  .ib-tactions{display:flex;gap:8px;flex-wrap:wrap}
  .ib-tactions a{font-size:13px}
  .ib-msg{border:1px solid #ececf0;border-radius:12px;padding:12px 14px}
  .ib-msg.mine{background:#f7f9fc}
  .ib-msg header{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13px;color:#6e6e73;margin:0 0 8px}
  .ib-msg header b{color:#1d1d1f}
  .ib-msg pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:14px;line-height:1.55;margin:0;color:#1d1d1f}
  .ib-reply label{display:block;font-size:11.5px;font-weight:650;letter-spacing:1.1px;text-transform:uppercase;color:#6e6e73;margin:0 0 6px}
  .ib-reply textarea{width:100%;min-height:150px;font:inherit;font-size:14.5px;line-height:1.5;border:1px solid #d2d2d7;border-radius:10px;padding:10px 12px;resize:vertical}
  .ib-reply textarea:focus-visible{outline:2px solid #0071e3;outline-offset:1px}
  .ib-ractions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .ib-review{padding:12px 14px;border-radius:12px;background:#eef7ee;border:1px solid #cfe5cf;color:#1f4d1f;font-size:13.5px;line-height:1.5;margin-top:10px}
  .ib-review[hidden]{display:none}
  .ib-review ul{margin:6px 0 6px 18px;padding:0}
  .ib-empty{padding:18px;font-size:13.5px;color:#6e6e73}
  .ib-alert{padding:12px 14px;border-radius:12px;background:#fdeeee;border:1px solid #e7b4b4;color:#8e1f2a;font-size:13.5px}
  .ib-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);max-width:min(560px,calc(100vw - 32px));background:#1d1d1f;color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:460}
  .ib-toast.show{opacity:1}.ib-toast.warn{background:#8e1f2a}
  @media(prefers-reduced-motion:reduce){.ib-toast{transition:none}}
</style>
<script defer src="/assets/js/portal-shell.js?v=20261013"></script>
</head>
<body>
<header class="topbar"><img src="/assets/brand/logo-blue.svg" alt="Staffify"><nav class="nav"><a href="/hub/">Hub</a></nav><div class="tb-right" id="tbRight"></div></header>
<main class="wrap" id="app"><p class="ib-note">Loading your inbox…</p></main>
<div class="ib-toast" id="ib-toast" role="status" aria-live="polite"></div>
<script type="module" src="/assets/js/rep-inbox.js?v=20261027"></script>
</body>
</html>
