<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Hub — Staffify</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="icon" type="image/svg+xml" href="/assets/brand/icon.svg?v=2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      .lookup { margin:0 0 26px; }
      .lookup input { width:100%; font-family:inherit; font-size:15.5px; color:#fff;
        background:rgba(255,255,255,0.045); border:1px solid rgba(255,255,255,0.10);
        border-radius:14px; padding:15px 18px; outline:none; }
      .lookup input:focus { border-color:#1abde1; background:rgba(255,255,255,0.06); }
      .lookup input::placeholder { color:#6f7680; }
      .lkout { display:none; margin-top:10px; }
      .lkcard { background:rgba(255,255,255,0.035); border:1px solid rgba(255,255,255,0.09);
        border-radius:14px; padding:18px 20px; }
      .lkwho { font-size:19px; font-weight:800; letter-spacing:-0.01em; }
      .lksub { font-size:13.5px; color:#9ba1ab; margin-top:3px; }
      .lkflags { display:flex; flex-wrap:wrap; gap:7px; margin-top:11px; }
      .lkflag { font-size:11.5px; font-weight:800; letter-spacing:.04em; text-transform:uppercase;
        padding:4px 10px; border-radius:999px; }
      .lkflag.bad { color:#ffb4a2; background:rgba(255,120,90,.12); border:1px solid rgba(255,120,90,.34); }
      .lkflag.warn{ color:#e8c37a; background:rgba(232,195,122,.10); border:1px solid rgba(232,195,122,.30); }
      .lkadvice { margin-top:12px; font-size:14.5px; line-height:1.55; color:#dfe4ea; }
      .lksay { margin-top:11px; padding:11px 13px; border-radius:10px; font-size:14px; line-height:1.5;
        background:rgba(26,189,225,.07); border-left:2px solid #1abde1; color:#dfe4ea; }
      .lksay b { display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
        color:#1abde1; margin-bottom:4px; font-weight:800; }
      .lkcall { display:inline-block; margin-top:13px; font-size:16px; font-weight:800; color:#1abde1; text-decoration:none; }
      .lkempty { padding:14px 18px; font-size:14px; color:#9ba1ab;
        background:rgba(255,255,255,0.03); border:1px dashed rgba(255,255,255,0.10); border-radius:14px; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#050507; --white:#fff; --cyan:#1abde1; --cyan-hi:#5fe0fa; --cyan-dark:#0d82b8; --muted:#9ba1ab; --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.09); }
        .grad { background: linear-gradient(100deg, var(--cyan-hi) 0%, var(--cyan) 45%, var(--cyan-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; }
        .eyebrow::before { content: ''; width: 30px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
        .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); border: 1px solid rgba(26,189,225,0.4); background: rgba(26,189,225,0.08); border-radius: 999px; padding: 6px 14px; }
        .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
        body { font-family:"Inter",-apple-system,sans-serif; background: radial-gradient(1000px 600px at 90% -5%, rgba(26,189,225,0.08), transparent 60%), radial-gradient(800px 600px at -10% 40%, rgba(13,86,164,0.10), transparent 55%), var(--bg); color:var(--white); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
        .topbar { position:sticky; top:0; z-index:10; background:rgba(5,5,7,0.85); backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); padding:14px 28px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
        .topbar img { height:24px; }
        .tb-right { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted); }
        .btn { font-size:13px; font-weight:700; color:#04222b; background:var(--cyan); border:none; border-radius:999px; padding:8px 16px; cursor:pointer; }
        .btn:hover { background:var(--cyan-hi); }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--card-border); }
        .btn-ghost:hover { color:var(--white); }
        .nav { display:flex; gap:6px; flex-wrap:wrap; }
        .nav a { font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; padding:8px 14px; border-radius:999px; }
        .nav a.active { color:var(--cyan-hi); background:rgba(26,189,225,0.10); }
        @media (max-width: 880px) { .topbar { flex-wrap: wrap; } .nav { order: 3; flex-basis: 100%; justify-content: center; margin-top: 6px; } }
        .nav a:hover { color:var(--white); }
        .wrap { max-width:1180px; margin:0 auto; padding:28px; }
        h1 { font-size:28px; font-weight:900; letter-spacing:-0.02em; margin-bottom:4px; }
        .sub { font-size:14.5px; color:var(--muted); margin-bottom:26px; }
        .cols { display:grid; grid-template-columns:1.15fr 0.85fr; gap:22px; align-items:start; }
        @media (max-width:900px){ .cols { grid-template-columns:1fr; } }
        .panel { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:20px 22px; margin-bottom:18px; }
        .ph { display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:14px; }
        .ph h2 { font-size:13px; font-weight:800; letter-spacing:0.16em; text-transform:uppercase; color:var(--cyan); }
        .ph .meta { font-size:12.5px; color:var(--muted); }
        .ph a { font-size:12.5px; color:var(--cyan-hi); text-decoration:none; font-weight:700; }
        .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid rgba(255,255,255,0.06); flex-wrap:wrap; }
        .row:last-child { border-bottom:none; }
        .when { font-size:12.5px; color:var(--muted); width:112px; flex-shrink:0; }
        .who { flex:1; min-width:150px; }
        .who .n { font-size:15px; font-weight:700; }
        .who .e { font-size:12.5px; }
        .who .e a { color:var(--cyan-hi); text-decoration:none; }
        .tag { font-size:11px; font-weight:600; color:var(--cyan-hi); background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.3); border-radius:999px; padding:3px 10px; white-space:nowrap; }
        .join { font-size:12.5px; font-weight:700; color:var(--cyan-hi); text-decoration:none; white-space:nowrap; }
        .mod { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
        .mod:last-child { border-bottom:none; }
        .mod .num { font-size:11.5px; font-weight:800; color:var(--cyan); width:22px; flex-shrink:0; }
        .mod .t { flex:1; font-size:14px; font-weight:600; color:#dfe3e8; }
        .mod a { color:inherit; text-decoration:none; }
        .mod a:hover { color:var(--cyan-hi); }
        .st { font-size:10.5px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase; padding:3px 9px; border-radius:999px; white-space:nowrap; }
        .st-ready { color:#7ef5c2; background:rgba(29,158,117,0.16); border:1px solid rgba(29,158,117,0.4); }
        .st-prog { color:var(--cyan-hi); background:rgba(26,189,225,0.12); border:1px solid rgba(26,189,225,0.35); }
        .st-soon { color:var(--muted); background:rgba(255,255,255,0.04); border:1px solid var(--card-border); }
        .tools { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .tool { display:block; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:10px; padding:12px 14px; text-decoration:none; }
        .tool:hover { border-color:rgba(26,189,225,0.45); }
        .tool .tt { font-size:13.5px; font-weight:700; color:var(--white); }
        .tool .td { font-size:11.5px; color:var(--muted); margin-top:2px; }
        .connect { text-align:center; padding:22px 16px; }
        .connect p { font-size:13.5px; color:var(--muted); margin-bottom:6px; }
        .connect .big { font-size:15px; font-weight:700; color:var(--white); margin-bottom:6px; }
        .gate { max-width:440px; margin:60px auto; background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:32px 28px; text-align:center; }
        .gate h2 { font-size:20px; font-weight:800; margin-bottom:8px; }
        .gate p { font-size:14px; color:var(--muted); margin-bottom:20px; }
        .gate input { width:100%; font-family:inherit; font-size:15px; color:var(--white); background:rgba(255,255,255,0.05); border:1.5px solid var(--card-border); border-radius:10px; padding:12px 14px; margin-bottom:14px; }
        .gate input:focus { outline:none; border-color:var(--cyan); }
        .gate .btn { width:100%; padding:13px; font-size:15px; }
        .gbtn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
                padding:13px; margin-bottom:16px; font-family:inherit; font-size:15px; font-weight:800;
                color:#1f1f1f; background:#fff; border:1px solid #dadce0; border-radius:10px;
                text-decoration:none; cursor:pointer; }
        .gbtn:hover { background:#f7f8f8; }
        .gbtn svg { flex:0 0 auto; }
        .or { display:flex; align-items:center; gap:10px; margin:0 0 14px; font-size:12px;
              color:var(--muted); text-transform:uppercase; letter-spacing:.08em; }
        .or::before, .or::after { content:''; flex:1; height:1px; background:var(--card-border); }
        .err { color:#ff9a8d; font-size:13px; margin-top:10px; min-height:18px; }
        .empty { color:var(--muted); font-size:13.5px; padding:16px 0; }
    </style>

<body>

<header class="topbar">
    <img src="/assets/brand/logo-blue.svg" alt="Staffify">
    <nav class="nav">
        <a href="/hub/" class="active">Hub</a>
        <a href="/dialer/">Dialer</a>
        <a href="/scoreboard/">Scoreboard</a>
        <a href="/pipeline/">Pipeline</a><a href="/commissions/">Commissions</a>
        <a href="/training/sales/">Training</a>
        <a href="/careers/sales/inbox/">Applicants</a>
        <a href="https://recruiting.gostaffify.com/dashboard" target="_blank" rel="noopener" style="border:1px solid var(--card-border); margin-left:8px;">Talent Console &#8599;</a>
    </nav>
    <div class="tb-right" id="tbRight"></div>
</header>

<div class="wrap" id="app"></div>

<script src="/assets/js/close-plan.js"></script>
<script>
(function(){
  var app=document.getElementById('app');
  var tbRight=document.getElementById('tbRight');
  var ME=null;
  var LEADS=[];

  var MODULES=[
    ['01','The Offer, Inside Out','ready'],
    ['02','Who Buys, and Why','soon'],
    ['03','Building Pipeline','soon'],
    ['04','The Discovery Call','soon'],
    ['05','The Presentation & Close','prog'],
    ['06','Objection Handling','soon'],
    ['07','Tools & Process','prog'],
    ['08','Certification','soon']
  ];
  var TOOLS=[
    ['/training/sales/remote-hiring/','Remote hiring script','Call open job postings'],
    ['/pitch/','Pitch deck','Walk a prospect through it'],
    ['/how-it-works/','How it works','Pricing, process, guarantee'],
    ['/careers/sales/comp/','Comp plan','What you earn'],
    ['/admins/','Role pages','Send to prospects']
  ];

  // Recordings live in a private bucket, so pointing an <audio> tag straight at the stored URL gets a
  // 403 and the player just sits at 0:00 with no error the rep can see. The call id is the filename,
  // and the server can already fetch the audio with it, so route playback through that instead.
  function playableRecording(url){
    var u = String(url == null ? '' : url);
    if (!u) return '';
    if (u.indexOf('/api/') === 0) return u;               // already proxied
    var m = u.match(/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/i);
    if (!m) return u;                                     // not a call recording, leave it alone
    return '/api/outreach-log/?action=audio&call_id=' + encodeURIComponent(m[1]);
  }

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function fmt(ts){var d=new Date(ts); return d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});}
  function ago(ms){var n=Number(ms); if(!n)return ''; var d=Math.floor((Date.now()-n)/864e5); return d<=0?'today':(d===1?'1d ago':d+'d ago');}
  function qp(k){return new URLSearchParams(location.search).get(k);}

    var EMSG={expired:'That link expired. Request a new one.',
      norep:'That Google account is not set up as a rep yet. Ask Paul to add you.',
      google_denied:'Google sign-in was cancelled.',
      google_unverified:'That Google account has no verified email address.',
      google_exchange:'Google sign-in failed. Try again, or use the email link below.',
      google_unconfigured:'Google sign-in is not configured yet. Use the email link below.',
      google_incomplete:'Google sign-in did not complete. Try again.',
      google_state:'Google sign-in timed out. Try again.'};
  function showSignIn(msg){
    tbRight.innerHTML='';
    app.innerHTML='<div class="gate"><h2>Staffify sales hub</h2><p>Use the Google account you already sign in to work with.</p>'+
      '<a class="gbtn" href="/api/auth-google-start">'+'<svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">'+'<path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.63z"/>'+'<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.17l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>'+'<path fill="#FBBC05" d="M3.97 10.73a5.4 5.4 0 0 1 0-3.46V4.94H.96a9 9 0 0 0 0 8.12l3.01-2.33z"/>'+'<path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.42 0 9 0A9 9 0 0 0 .96 4.94l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>'+'</svg>Continue with Google</a>'+
      '<div class="or">or</div>'+
      '<input id="em" type="email" placeholder="you@example.com" autocomplete="email">'+
            '<button class="btn" id="go">Email me a sign-in link</button>'+
      '<div class="err" id="err">'+(msg||'')+'</div></div>';
    document.getElementById('go').onclick=send;
    document.getElementById('em').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
  }

  async function send(){
    var el=document.getElementById('em'), btn=document.getElementById('go');
    var email=(el.value||'').trim();
    if(!email){el.focus();return;}
    btn.disabled=true; btn.textContent='Sending...';
    try{
      await fetch('/api/auth-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email})});
    }catch(e){}
    app.innerHTML='<div class="gate"><h2>Check your email</h2><p>If '+esc(email)+' is set up as a rep, a sign-in link is on its way. It works once and expires in 20 minutes.</p></div>';
  }

  async function load(){
    app.innerHTML='<div class="empty">Loading your hub...</div>';
    tbRight.innerHTML='';
    var meRes;
    try{ meRes=await fetch('/api/auth-me',{cache:'no-store'}); }catch(e){ showSignIn('Network error.'); return; }
    if(meRes.status!==200){
      var m=qp('e');
      showSignIn(EMSG[m]||'');
      return;
    }
    ME=(await meRes.json()).rep;
    var pipe=fetch('/api/sales-pipeline',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    var leads=fetch('/api/hot-leads',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;});
    var apps=(ME&&ME.role==='admin')?fetch('/api/sales-applicants/?format=json',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}):Promise.resolve(null);
    var out=await Promise.all([pipe,leads,apps]);
    render(out[0],out[1],out[2]);
  }

  function callRows(pipeData){
    if(!pipeData) return '<div class="empty">Could not load calls.</div>';
    var up=(pipeData.bookings||[]).filter(function(b){return b.when==='upcoming';})
      .sort(function(a,b){return new Date(a.start)-new Date(b.start);}).slice(0,6);
    if(!up.length) return '<div class="empty">No upcoming calls booked.</div>';
    return up.map(function(b){
      var join=b.join&&/^https?:/.test(b.join)?'<a class="join" href="'+esc(b.join)+'" target="_blank" rel="noopener">Join &#8599;</a>':'';
      return '<div class="row"><div class="when">'+fmt(b.start)+'</div><div class="who"><div class="n">'+esc(b.name||'(no name)')+'</div>'+
        (b.email?'<div class="e"><a href="mailto:'+esc(b.email)+'">'+esc(b.email)+'</a></div>':'')+
        '</div><span class="tag">'+esc(b.type||'Call')+'</span>'+join+'</div>';
    }).join('');
  }

  function leadRows(ld){
    if(!ld) return '<div class="empty">Could not load leads.</div>';
    if(!(ld.leads||[]).length) return '<div class="empty">No warm leads right now. The moment the engine gets someone interested, they land here.</div>';
    return ld.leads.slice(0,12).map(function(l,i){
      var grade=l.grade?'<span class="tag">'+esc(l.grade)+'</span>':'';
      var cp=l.transcript?('<button class="cp-btn" data-cp="'+i+'">AI close plan</button><div class="cp-out" id="cp-'+i+'"></div>'):'';
      return '<div class="row"><div class="who"><div class="n">'+esc(l.company||l.name||'Lead')+'</div>'+
        (l.phone?'<div class="e"><a href="tel:'+esc(l.phone)+'">'+esc(l.phone)+'</a></div>':'')+
        (l.summary?'<div style="font-size:12px;color:#9ba1ab;margin-top:3px;line-height:1.4">'+esc(l.summary)+'</div>':'')+
        (l.recordingUrl?'<audio controls preload="none" style="width:100%;margin-top:8px;height:32px" src="'+esc(playableRecording(l.recordingUrl))+'"></audio>':'')+
        (l.transcript?'<details style="margin-top:6px"><summary style="cursor:pointer;color:var(--cyan-hi);font-size:11.5px;font-weight:700">Transcript</summary><div style="font-size:12px;color:#9ba1ab;margin-top:6px;max-height:170px;overflow:auto;white-space:pre-wrap;line-height:1.5">'+esc(l.transcript)+'</div></details>':'')+
        cp+
        '</div>'+grade+'</div>';
    }).join('');
  }
  function appRows(apps){
    var al=Array.isArray(apps)?apps:(apps&&(apps.applicants||apps.data)||[]);
    if(!al.length) return '<div class="empty">No applicants yet.</div>';
    return al.slice(0,6).map(function(a){
      return '<div class="row"><div class="who"><div class="n">'+esc(a.name||'(no name)')+'</div>'+
        (a.email?'<div class="e"><a href="mailto:'+esc(a.email)+'">'+esc(a.email)+'</a></div>':'')+'</div>'+
        (a.experience?'<span class="tag">'+esc(a.experience)+' yrs</span>':'')+'</div>';
    }).join('');
  }

  // Someone calls back and the rep has seconds to work out who they are. Number, name, company or
  // email, and it answers from the live queue, the hot leads, HubSpot and the opt-out list at once.
  function lookupBox(){
    return '<div class="lookup">'+
      '<input id="lk" type="search" autocomplete="off" placeholder="Who is calling? Paste a number, or type a name or company">'+
      '<div id="lkout" class="lkout"></div></div>';
  }

  function lkFlag(cls, text){ return '<span class="lkflag '+cls+'">'+esc(text)+'</span>'; }

  function lkRender(j){
    var box=document.getElementById('lkout'); if(!box) return;
    if(j.__loading){ box.innerHTML='<div class="lkempty">Looking...</div>'; box.style.display='block'; return; }
    var flags='';
    if(j.optedOut) flags+=lkFlag('bad','Opted out, do not pitch');
    if(j.alreadyWorked) flags+=lkFlag('warn','Already worked');
    var head=(j.found&&j.found.length)?j.found[0]:null;
    var who = head ? (head.company||head.name||'Unknown')
            : (j.hubspot ? (j.hubspot.company||j.hubspot.name||'In HubSpot') : 'Not in any campaign');
    var sub  = head ? [head.name, head.role||head.industry, head.city].filter(Boolean).join(' \u00b7 ')
            : (j.hubspot ? [j.hubspot.name, j.hubspot.email].filter(Boolean).join(' \u00b7 ') : '');
    var lines='';
    if(head&&head.sayThis) lines+='<div class="lksay"><b>Say this</b>'+esc(head.sayThis)+'</div>';
    if(head&&head.hook)    lines+='<div class="lksay"><b>The hook</b>'+esc(head.hook)+'</div>';
    if(head&&head.priorCall) flags+=lkFlag('warn','Previously booked a call'+(head.lastCall?' \u00b7 '+head.lastCall:''));
    box.innerHTML='<div class="lkcard">'+
      '<div class="lkwho">'+esc(who)+'</div>'+
      (sub?'<div class="lksub">'+esc(sub)+'</div>':'')+
      (flags?'<div class="lkflags">'+flags+'</div>':'')+
      '<div class="lkadvice">'+esc(j.advice||'')+'</div>'+
      lines+
      (head&&head.phone?'<a class="lkcall" href="tel:'+esc(head.phone)+'">'+esc(head.phone)+'</a>':'')+
      '</div>';
    box.style.display='block';
  }

  var lkTimer=null;
  function wireLookup(){
    var el=document.getElementById('lk'); if(!el) return;
    el.addEventListener('input', function(){
      var q=el.value.trim();
      var box=document.getElementById('lkout');
      if(q.length<3){ if(box){box.style.display='none';box.innerHTML='';} return; }
      clearTimeout(lkTimer);
      lkTimer=setTimeout(function(){
        lkRender({__loading:true});
        fetch('/api/lookup/?q='+encodeURIComponent(q),{cache:'no-store'})
          .then(function(r){return r.json();}).then(lkRender)
          .catch(function(){ var b=document.getElementById('lkout'); if(b) b.innerHTML='<div class="lkempty">Lookup failed. Try again.</div>'; });
      }, 250);
    });
  }

  function render(pipeData, ld, apps){
    tbRight.innerHTML='<a class="btn btn-ghost" href="/api/auth-logout" style="text-decoration:none">Sign out</a>';

    var upCount=pipeData?(pipeData.bookings||[]).filter(function(b){return b.when==='upcoming';}).length:0;
    var leadCount=ld?(ld.count||0):0;
    var first=(ME.name||'').split(' ')[0]||'there';
    var isAdmin=(ME.role==='admin');
    var appList=Array.isArray(apps)?apps:(apps&&(apps.applicants||apps.data)||[]);
    var appsPanel=isAdmin?('<div class="panel"><div class="ph"><h2>Applicants</h2><a href="/careers/sales/inbox/">Open inbox &#8594;</a></div>'+appRows(apps)+'</div>'):'';

    var mods=MODULES.map(function(m){
      var cls=m[2]==='ready'?'st-ready':(m[2]==='prog'?'st-prog':'st-soon');
      var lbl=m[2]==='ready'?'Ready':(m[2]==='prog'?'In progress':'Soon');
      return '<div class="mod"><span class="num">'+m[0]+'</span><span class="t"><a href="/training/sales/">'+esc(m[1])+'</a></span><span class="st '+cls+'">'+lbl+'</span></div>';
    }).join('');

    var tools=TOOLS.map(function(t){
      return '<a class="tool" href="'+t[0]+'" target="_blank" rel="noopener"><div class="tt">'+esc(t[1])+'</div><div class="td">'+esc(t[2])+'</div></a>';
    }).join('');

    app.innerHTML=
      lookupBox()+
      '<div class="eyebrow">Sales Hub</div><h1>Welcome back, <span class="grad">'+esc(first)+'</span></h1>'+
      '<div class="sub">'+upCount+' upcoming call'+(upCount===1?'':'s')+' &middot; '+leadCount+' warm lead'+(leadCount===1?'':'s')+(isAdmin?' &middot; '+appList.length+' applicant'+(appList.length===1?'':'s'):'')+' &middot; '+esc(ME.rate||'35')+'% commission</div>'+
      '<div class="cols">'+
        '<div>'+
          '<div class="panel"><div class="ph"><h2>Warm leads</h2><span class="meta">Live &middot; from the engine</span></div>'+leadRows(ld)+'</div>'+
          '<div class="panel"><div class="ph"><h2>Your day</h2><a href="/pipeline/">All bookings &#8594;</a></div>'+callRows(pipeData)+'</div>'+
          appsPanel+
        '</div>'+
        '<div>'+
          '<div class="panel"><div class="ph"><h2>The playbook</h2><a href="/training/sales/">Open training &#8594;</a></div>'+mods+'</div>'+
          '<div class="panel"><div class="ph"><h2>Your toolkit</h2></div><div class="tools">'+tools+'</div></div>'+
        '</div>'+
      '</div>';

    LEADS = (ld && ld.leads) ? ld.leads.slice(0,12) : [];
    Array.prototype.forEach.call(app.querySelectorAll('.cp-btn'), function(b){
      b.onclick=function(){
        var l=LEADS[+b.getAttribute('data-cp')]; if(!l||!window.StaffifyClosePlan) return;
        var mo=l.motion==='staffing'?'Staffify VA':(l.motion==='websites'?'Foundry website':'');
        var g=[l.grade,mo].filter(Boolean).join(' / ');
        StaffifyClosePlan.run({mode:'prep',transcript:l.transcript||'',name:l.name||'',company:l.company||'',grade:g,phone:l.phone||''}, document.getElementById('cp-'+b.getAttribute('data-cp')), b);
      };
    });
    wireLookup();
  }

  load();
})();
</script>
</body>
</html>
