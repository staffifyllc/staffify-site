<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialer — Staffify Sales</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#050507; --white:#fff; --cyan:#1abde1; --cyan-hi:#5fe0fa; --cyan-dark:#0d82b8; --muted:#9ba1ab; --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.09); --green:#1d9e75; --green-hi:#7ef5c2; }
        .grad { background: linear-gradient(100deg, var(--cyan-hi) 0%, var(--cyan) 45%, var(--cyan-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; }
        .eyebrow::before { content: ''; width: 30px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
        .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); border: 1px solid rgba(26,189,225,0.4); background: rgba(26,189,225,0.08); border-radius: 999px; padding: 6px 14px; }
        .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
        body { font-family:"Inter",-apple-system,sans-serif; background: radial-gradient(1000px 600px at 90% -5%, rgba(26,189,225,0.08), transparent 60%), radial-gradient(800px 600px at -10% 40%, rgba(13,86,164,0.10), transparent 55%), var(--bg); color:var(--white); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
        .topbar { position:sticky; top:0; z-index:10; background:rgba(5,5,7,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); padding:12px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .topbar img { height:22px; }
        .nav { display:flex; gap:5px; flex-wrap:wrap; }
        .nav a { font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; padding:7px 13px; border-radius:999px; }
        .nav a.active { color:var(--cyan-hi); background:rgba(26,189,225,0.10); }
        @media (max-width: 880px) { .topbar { flex-wrap: wrap; } .nav { order: 3; flex-basis: 100%; justify-content: center; margin-top: 6px; } }
        .tb-right { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); }
        .btn { font-size:13px; font-weight:700; color:#04222b; background:var(--cyan); border:none; border-radius:999px; padding:8px 15px; cursor:pointer; text-decoration:none; }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--card-border); }
        .wrap { max-width:720px; margin:0 auto; padding:22px; }
        .toprow { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
        .motions { display:flex; gap:6px; }
        .motions button { font-size:13.5px; font-weight:700; color:var(--muted); background:var(--card); border:1px solid var(--card-border); border-radius:999px; padding:8px 16px; cursor:pointer; }
        .motions button.on { color:#04222b; background:var(--cyan); border-color:var(--cyan); }
        .motions button.hot { color:#ffb59a; border-color:rgba(226,90,60,0.55); }
        .motions button.hot.on { color:#3a0f0c; background:#ff8a6b; border-color:#ff8a6b; }
        .stats { display:flex; gap:16px; font-size:12.5px; color:var(--muted); }
        .stats b { color:var(--white); font-weight:800; }
        .card { background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:26px 26px 22px; }
        .company { font-size:30px; font-weight:900; letter-spacing:-0.02em; line-height:1.1; }
        .sub { font-size:14px; color:var(--muted); margin-top:4px; }
        .phone { display:flex; align-items:center; gap:12px; margin:18px 0; }
        .phone a { font-size:30px; font-weight:900; letter-spacing:-0.01em; color:var(--cyan-hi); text-decoration:none; }
        .phone .call { font-size:13px; font-weight:800; color:#04222b; background:var(--green-hi); border-radius:999px; padding:8px 16px; text-decoration:none; }
        .lbl { font-size:11px; font-weight:800; letter-spacing:0.14em; text-transform:uppercase; color:var(--cyan); margin:18px 0 8px; }
        .brief { font-size:15.5px; color:#dfe3e8; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:14px 16px; }
        .ammorow { display:flex; gap:8px; flex-wrap:wrap; }
        .ammo { font-size:13px; font-weight:700; color:var(--cyan-hi); background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.35); border-radius:999px; padding:8px 14px; text-decoration:none; }
        .ammo:hover { background:rgba(26,189,225,0.16); }
        .say { font-size:17px; font-weight:600; color:#eaf6fb; background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.35); border-radius:12px; padding:16px 18px; line-height:1.5; }
        .say .line { margin-bottom:8px; } .say .line:last-child { margin-bottom:0; }
        details { margin-top:14px; border:1px solid var(--card-border); border-radius:12px; padding:0 16px; background:rgba(255,255,255,0.02); }
        summary { cursor:pointer; font-size:13.5px; font-weight:700; color:var(--cyan-hi); padding:13px 0; list-style:none; }
        summary::-webkit-details-marker { display:none; }
        .script { font-size:14px; color:#cfd4da; padding-bottom:14px; }
        .script b { color:var(--white); }
        .script .blk { margin-bottom:12px; white-space:pre-wrap; }
        .outcomes { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:22px; }
        @media (max-width:560px){ .outcomes { grid-template-columns:1fr 1fr; } .company,.phone a{font-size:26px;} }
        .oc { font-size:14.5px; font-weight:800; border:1px solid var(--card-border); border-radius:12px; padding:15px 10px; cursor:pointer; background:var(--card); color:var(--white); }
        .oc:hover { border-color:var(--cyan); }
        .oc.good { background:rgba(29,158,117,0.16); border-color:rgba(29,158,117,0.5); color:var(--green-hi); }
        .oc.warm { background:rgba(26,189,225,0.10); border-color:rgba(26,189,225,0.4); color:var(--cyan-hi); }
        .gate, .empty { max-width:440px; margin:70px auto; text-align:center; }
        .gate { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:32px 28px; }
        .gate h2, .empty h2 { font-size:22px; font-weight:900; margin-bottom:10px; }
        .gate p, .empty p { color:var(--muted); font-size:14.5px; margin-bottom:18px; }
        .gate input { width:100%; font-family:inherit; font-size:15px; color:var(--white); background:rgba(255,255,255,0.05); border:1.5px solid var(--card-border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
        .gate .btn { width:100%; padding:13px; }
        .err { color:#ff9a8d; font-size:13px; min-height:18px; }
        .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#0d1418; border:1px solid var(--card-border); color:#eaf6fb; font-size:13.5px; font-weight:600; padding:11px 18px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:20; }
        .toast.show { opacity:1; }
        .toast .undo { margin-left:14px; color:var(--cyan-hi); font-weight:800; cursor:pointer; text-decoration:underline; }
        .objrow { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .objchip { font-size:13px; font-weight:700; color:#ffb59a; background:rgba(226,90,60,0.10); border:1px solid rgba(226,90,60,0.4); border-radius:999px; padding:7px 13px; cursor:pointer; }
        .objchip:hover { color:#fff; }
        .objchip.on { color:#3a0f0c; background:#ff8a6b; border-color:#ff8a6b; }
        .objsay { font-size:16px; line-height:1.5; color:#eaf6fb; background:rgba(26,189,225,0.06); border:1px solid rgba(26,189,225,0.3); border-radius:12px; padding:14px 16px; margin-bottom:8px; display:none; }
        .objsay.show { display:block; }
        .quote { background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:14px 16px; margin-bottom:12px; }
        .qtiers { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
        .qtier { font-size:13px; font-weight:700; color:var(--muted); background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:999px; padding:7px 13px; cursor:pointer; }
        .qtier.on { color:#04222b; background:var(--cyan); border-color:var(--cyan); }
        .qtoggle { display:flex; align-items:center; gap:8px; font-size:13.5px; color:#cfd4da; cursor:pointer; margin-bottom:10px; }
        .qrow { display:flex; justify-content:space-between; align-items:baseline; font-size:15px; color:#cfd4da; padding:4px 0; }
        .qrow b { font-size:18px; color:#fff; }
        .qrow.qfin { font-size:13px; color:var(--muted); } .qrow.qfin b { font-size:13px; color:var(--cyan-hi); }
        .qguard { font-size:12.5px; color:#ffb59a; margin-top:8px; border-top:1px solid rgba(255,255,255,0.08); padding-top:8px; line-height:1.5; }
    </style>
</head>
<body>

<header class="topbar">
    <img src="/assets/brand/logo-blue.svg" alt="Staffify">
    <nav class="nav">
        <a href="/hub/">Hub</a>
        <a href="/dialer/" class="active">Dialer</a>
        <a href="/scoreboard/">Scoreboard</a>
        <a href="/pipeline/">Pipeline</a>
        <a href="/training/sales/">Training</a>
        <a href="/careers/sales/inbox/">Applicants</a>
        <a href="https://recruiting.gostaffify.com" target="_blank" rel="noopener" style="border:1px solid var(--card-border); margin-left:8px;">Talent Console &#8599;</a>
    </nav>
    <div class="tb-right" id="tbRight"></div>
</header>

<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var app=document.getElementById('app'), tbRight=document.getElementById('tbRight'), toastEl=document.getElementById('toast');
  var ME=null, MOTION='websites', firstLoad=true, QUEUES={websites:[],staffing:[],hot:[]}, TRAIN={}, SCORE=null, LABEL={websites:'Foundry',staffing:'Staffify',hot:'Hot'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function toast(m){toastEl.textContent=m; toastEl.classList.add('show'); setTimeout(function(){toastEl.classList.remove('show');},1600);}
  function telHref(p){return 'tel:'+String(p||'').replace(/[^0-9+]/g,'');}
  function ammo(L){
    var loc=[L.company,L.city].filter(Boolean).join(' ');
    var qs=encodeURIComponent(loc||L.name||''); if(!qs) return '';
    var links=[];
    links.push('<a class="ammo" target="_blank" rel="noopener" href="https://www.google.com/search?q='+qs+'">Google them</a>');
    links.push('<a class="ammo" target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+qs+'">Maps &amp; reviews</a>');
    if(L.website){ links.push('<a class="ammo" target="_blank" rel="noopener" href="'+esc(L.website)+'">Their site</a>'); }
    else { links.push('<a class="ammo" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent(loc+' official website')+'">Find their site</a>'); }
    var liq=encodeURIComponent(L.name||L.company||'');
    links.push('<a class="ammo" target="_blank" rel="noopener" href="https://www.linkedin.com/search/results/all/?keywords='+liq+'">LinkedIn</a>');
    return '<div class="lbl">Arm yourself</div><div class="ammorow">'+links.join('')+'</div>';
  }
  function firstNameOf(s){return String(s||'').trim().split(/\s+/)[0]||'';}
  function fillTokens(line, lead){
    var first=firstNameOf(lead.name);
    var you=firstNameOf(ME&&ME.name)||'me';
    var m=line.match(/\(no name:\s*"([^"]+)"\)/i);
    if(m){ line = first ? line.replace(/\s*\(no name:[^)]*\)/i,'') : m[1]; }
    return line.replace(/\[first name\]/gi, first||'there').replace(/\[company\]/gi, lead.company||'your company').replace(/\[you\]/gi, you);
  }

  function repGet(){try{var r=JSON.parse(localStorage.getItem('sfy_rep')||'null');if(r&&r.name)return r;}catch(e){}return null;}
  function repSet(n){n=(n||'').trim();if(!n)return null;var em=n.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/(^\.|\.$)/g,'')+'@rep.local';var r={name:n,email:em};try{localStorage.setItem('sfy_rep',JSON.stringify(r));}catch(x){}return r;}
  function nameChip(){var r=repGet();return '<button class="btn btn-ghost" id="nm">'+(r?('Hi, '+esc(r.name.split(' ')[0])):'Set your name')+'</button>';}
  function wireChip(){var b=document.getElementById('nm');if(b)b.onclick=function(){var r=repGet();var n=prompt('Your name (shows on the scoreboard):',r?r.name:'');if(n){repSet(n);ME=repGet();tbRight.innerHTML=nameChip();wireChip();render();}};}

  async function boot(){
    app.innerHTML='<div class="empty"><p>Loading your call list...</p></div>';
    ME=repGet();
    tbRight.innerHTML=nameChip(); wireChip();
    await refresh();
  }

  async function refresh(){
    var results=await Promise.all([
      fetch('/api/call-queue?action=list&n=500',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/call-queue?action=training',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/call-queue?action=scoreboard',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/hot-leads',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/winback-leads',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]);
    var list=results[0]||{};
    QUEUES.websites=Array.isArray(list.websites)?list.websites:[];
    QUEUES.staffing=(results[4]&&results[4].leads)||[];
    QUEUES.hot=(results[3]&&results[3].leads)||[];
    (results[1]&&results[1].motions||[]).forEach(function(m){TRAIN[m.key]=m;});
    SCORE=results[2]||null;
    if(firstLoad && QUEUES.hot.length){ MOTION='hot'; }
    firstLoad=false;
    render();
  }

  // ============ CLOSING COCKPIT ============
  var OBJECTIONS=[
    {label:'“Too expensive”', say:'Compared to what? A US admin runs $4,500 to $6,500 a month fully loaded. Ours is about $2,200 a month all in, payroll, HR and benefits included. Onboarding is a one-time $2,099 if you decide today, and it is financeable at zero interest. What would getting this off your plate be worth to you?'},
    {label:'“Let me think”', say:'Totally fair. Is it the person or the price you want to think through? The action-taker rate saves you $400 but it is only good for 24 hours, and the lifetime replacement guarantee means your risk here is basically zero. What is the real hesitation?'},
    {label:'“Offshore quality?”', say:'I hear you. We screen 150 to 250 people per role and you only ever meet the top 3, after a paid skills test on real work and reference checks. Attrition is under 8 percent because we pay well, tenure averages 3 plus years, and if anyone is ever off, we replace them free, for life.'},
    {label:'“Not right now”', say:'Makes sense. Good news is you do not front anything to start, we roll the onboarding into the hourly rate at zero interest, so there is no cash out of pocket today. What would need to be true for the timing to work?'},
    {label:'“Send me info”', say:'Happy to, I will text you the pricing page right now while we are on. What is the best cell? Open it up, and while you have it, tell me the first thing a great hire would take off your plate.'},
    {label:'Gatekeeper', say:'Totally get it, is the owner around by any chance? Quick question only they can answer, two minutes tops. If not, when is the best time to catch them?'}
  ];
  function renderObjections(){
    return '<div class="lbl">Objection? Tap the comeback</div><div class="objrow">'+
      OBJECTIONS.map(function(o,i){return '<button class="objchip" data-obj="'+i+'">'+esc(o.label)+'</button>';}).join('')+
      '</div><div class="objsay" id="objsay"></div>';
  }
  var QUOTE_TIERS=[{label:'1 hire',onb:2499},{label:'2 hires',onb:2299},{label:'3-4',onb:2099},{label:'5-9',onb:1799},{label:'10+',onb:1499}];
  var quoteTier=0, quoteAction=true;
  function quoteOut(){
    var t=QUOTE_TIERS[quoteTier], onb=t.onb-(quoteAction?400:0), comm=Math.round(onb*0.35), floorComm=Math.round(1699*0.35);
    return '<div class="qrow"><span>Client onboarding'+(quoteTier?' &middot; '+esc(t.label):'')+'</span><b>$'+onb.toLocaleString()+'</b></div>'+
      '<div class="qrow"><span>Your 35% commission</span><b style="color:#7ef5c2">$'+comm.toLocaleString()+'</b></div>'+
      '<div class="qrow qfin"><span>Or roll it into the rate</span><b>+$1/hr &middot; $0 today &middot; 0% interest</b></div>'+
      '<div class="qguard">Anchor $'+(quoteAction?'2,099':'2,499')+' &middot; floor $1,699 (you make ~$'+floorComm+'). Every $100 you discount is $35 out of YOUR pocket.</div>';
  }
  function renderQuote(){
    return '<div class="lbl">Quick quote &amp; your cut</div><div class="quote">'+
      '<div class="qtiers">'+QUOTE_TIERS.map(function(t,i){return '<button class="qtier'+(i===quoteTier?' on':'')+'" data-tier="'+i+'">'+esc(t.label)+'</button>';}).join('')+'</div>'+
      '<label class="qtoggle"><input type="checkbox" id="qaction"'+(quoteAction?' checked':'')+'> Action-taker rate (decide on the call, &minus;$400)</label>'+
      '<div class="qout" id="qout">'+quoteOut()+'</div>'+
      '</div>';
  }
  function refreshQuote(){ Array.prototype.forEach.call(document.querySelectorAll('.qtier'),function(b){ b.classList.toggle('on', (+b.getAttribute('data-tier'))===quoteTier); }); var qo=document.getElementById('qout'); if(qo)qo.innerHTML=quoteOut(); }

  // Log with a 5-second Undo window so a misclick never burns a warm lead.
  var pendingLog=null;
  function commitLog(p){
    var r=repGet();
    if(p.motion==='hot'){
      try{ fetch('/api/hot-leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.lead.id,outcome:p.outcome,motion:p.lead.motion,company:p.lead.company,rep:r&&r.name,email:r&&r.email})}); }catch(e){}
      return;
    }
    try{
      fetch('/api/call-queue?action=log',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.lead.id,outcome:p.outcome,motion:p.motion,rep:r&&r.name,email:r&&r.email})})
        .then(function(){ return fetch('/api/call-queue?action=scoreboard',{cache:'no-store'}); })
        .then(function(s){ return s&&s.ok?s.json():null; })
        .then(function(j){ if(j){ SCORE=j; if(!pendingLog) render(); } }).catch(function(){});
    }catch(e){}
  }
  function flushPending(){ if(pendingLog){ var p=pendingLog; pendingLog=null; clearTimeout(p.timer); commitLog(p); } }
  function doUndo(){ if(!pendingLog) return; var p=pendingLog; pendingLog=null; clearTimeout(p.timer); (QUEUES[p.motion]||[]).unshift(p.lead); render(); toast('Undone. Lead is back.'); }
  function toastUndo(msg){ toastEl.innerHTML=esc(msg)+'<span class="undo" id="undoBtn">Undo</span>'; toastEl.classList.add('show'); var b=document.getElementById('undoBtn'); if(b)b.onclick=doUndo; clearTimeout(toastEl._ut); toastEl._ut=setTimeout(function(){toastEl.classList.remove('show');},5000); }

  // Keyboard shortcuts for fast, eyes-on-the-prospect logging.
  document.addEventListener('keydown', function(e){
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    var tag=(e.target&&e.target.tagName||'').toLowerCase(); if(tag==='input'||tag==='textarea') return;
    if(!document.querySelector('.oc')) return;
    var map=MOTION==='hot' ? {'1':'won','2':'callback','n':'no_answer','x':'not_interested','b':'bad_number'} : {'1':'interested','2':'callback','n':'no_answer','v':'voicemail','g':'gatekeeper','x':'not_interested','b':'bad_number'};
    var o=map[(e.key||'').toLowerCase()]; if(o){ e.preventDefault(); logOutcome(o); }
  });

  function render(){
    var q=QUEUES[MOTION]||[];
    var t=SCORE&&SCORE.total||{};
    var head=
      '<div class="eyebrow" style="margin-bottom:12px">The Dialer</div>'+
      '<div class="toprow">'+
        '<div class="motions">'+
          (QUEUES.hot.length?'<button class="hot '+(MOTION==='hot'?'on':'')+'" data-m="hot">🔥 Hot &middot; '+QUEUES.hot.length+'</button>':'')+
          '<button class="'+(MOTION==='websites'?'on':'')+'" data-m="websites">Foundry &middot; '+(QUEUES.websites.length)+'</button>'+
          '<button class="'+(MOTION==='staffing'?'on':'')+'" data-m="staffing">Staffify &middot; '+(QUEUES.staffing.length)+'</button>'+
        '</div>'+
        '<div class="stats"><span>Dials <b>'+(t.dials||0)+'</b></span><span>Answers <b>'+(t.answers||0)+'</b></span><span>Interested <b>'+(t.interested||0)+'</b></span></div>'+
      '</div>';

    if(MOTION==='hot'){ renderHot(head, QUEUES.hot); return; }

    if(!q.length){
      app.innerHTML=head+'<div class="empty"><h2>All caught up on '+esc(LABEL[MOTION])+'.</h2><p>No one left to call in this list right now. Switch motions or check back later.</p></div>';
      wire();
      return;
    }
    var L=q[0], tr=TRAIN[MOTION]||{};
    var opArr=(tr.opener&&tr.opener.length)?tr.opener:(Array.isArray(L.opener)?L.opener:[L.opener||'']);
    var openerLines=opArr.filter(Boolean).map(function(x){return '<div class="line">'+esc(fillTokens(x,L))+'</div>';}).join('');
    var scriptBits='';
    if(tr.goal) scriptBits+='<div class="blk"><b>Goal:</b> '+esc(tr.goal)+'</div>';
    if(tr.theAsk) scriptBits+='<div class="blk"><b>The ask:</b> '+esc(fillTokens(tr.theAsk,L))+'</div>';
    var priceText=(MOTION==='websites') ? 'Only if THEY ask: normally $4,995, but we are building our roofing portfolio right now so we will rebuild it for $1,499. Half to start, half when it is live.' : tr.price;
    if(priceText) scriptBits+='<div class="blk"><b>Price (only if asked):</b> '+esc(priceText)+'</div>';
    if(tr.rules&&tr.rules.length) scriptBits+='<div class="blk"><b>Rules:</b>\n- '+tr.rules.map(esc).join('\n- ')+'</div>';
    if(tr.objections) scriptBits+='<div class="blk"><b>Objections:</b>\n'+esc(tr.objections)+'</div>';

    app.innerHTML=head+
      '<div class="card">'+
        '<div class="company">'+esc(L.company||'(no company)')+'</div>'+
        '<div class="sub">'+esc([L.name,L.city].filter(Boolean).join(' &middot; ')||LABEL[MOTION]+' lead')+'</div>'+
        '<div class="phone"><a href="'+telHref(L.phone)+'">'+esc(L.phone||'no number')+'</a>'+(L.phone?'<a class="call" href="'+telHref(L.phone)+'">Call now</a>':'')+'</div>'+
        '<div class="lbl">Say this</div><div class="say">'+openerLines+'</div>'+
        (L.brief?'<div class="lbl">Context</div><div class="brief">'+esc(L.brief)+'</div>':'')+
        ammo(L)+
        (scriptBits?'<details><summary>Full script, objections & rules</summary><div class="script">'+scriptBits+'</div></details>':'')+
        renderQuote()+
        renderObjections()+
        '<div class="lbl">How did it go?</div>'+
        '<div class="outcomes">'+
          '<button class="oc good" data-o="interested">Interested</button>'+
          '<button class="oc warm" data-o="callback">Callback</button>'+
          '<button class="oc" data-o="no_answer">No answer</button>'+
          '<button class="oc" data-o="voicemail">Voicemail</button>'+
          '<button class="oc" data-o="gatekeeper">Gatekeeper</button>'+
          '<button class="oc" data-o="not_interested">Not interested</button>'+
          '<button class="oc" data-o="bad_number">Bad number</button>'+
        '</div>'+
      '</div>';
    wire();
  }

  function renderHot(head, q){
    if(!q.length){
      app.innerHTML=head+'<div class="empty"><h2>No hot leads waiting.</h2><p>When Bland gets someone interested, they land here to close. Keep dialing Foundry or Staffify in the meantime.</p></div>';
      wire(); return;
    }
    var L=q[0];
    var ctx=L.summary?'<div class="lbl">What Bland learned</div><div class="brief">'+esc(L.summary)+'</div>':'';
    var rec=L.recordingUrl?'<div class="lbl">Listen to the call</div><audio controls preload="none" style="width:100%;height:38px" src="'+esc(L.recordingUrl)+'"></audio>':'';
    var trans=L.transcript?'<details><summary>Full call transcript</summary><div class="script"><div class="blk">'+esc(L.transcript)+'</div></div></details>':'';
    app.innerHTML=head+
      '<div class="card">'+
        '<div class="lbl">🔥 Interested &middot; call now while they are hot</div>'+
        '<div class="company">'+esc(L.company||L.name||'Hot lead')+'</div>'+
        '<div class="sub">'+esc([L.name,L.email].filter(Boolean).join(' &middot; ')||'From '+(L.source||'Bland'))+'</div>'+
        '<div class="phone"><a href="'+telHref(L.phone)+'">'+esc(L.phone||'no number')+'</a>'+(L.phone?'<a class="call" href="'+telHref(L.phone)+'">Call now</a>':'')+'</div>'+
        ctx+rec+trans+
        renderQuote()+
        renderObjections()+
        '<div class="lbl">How did it go?</div>'+
        '<div class="outcomes">'+
          '<button class="oc good" data-o="won">Closed / Won</button>'+
          '<button class="oc warm" data-o="callback">Callback</button>'+
          '<button class="oc" data-o="no_answer">No answer</button>'+
          '<button class="oc" data-o="not_interested">Not interested</button>'+
          '<button class="oc" data-o="bad_number">Bad number</button>'+
        '</div>'+
      '</div>';
    wire();
  }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('.motions button'),function(b){ b.onclick=function(){MOTION=b.getAttribute('data-m'); render();}; });
    Array.prototype.forEach.call(document.querySelectorAll('.oc'),function(b){ b.onclick=function(){ logOutcome(b.getAttribute('data-o')); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.objchip'),function(b){ b.onclick=function(){ var i=+b.getAttribute('data-obj'); var say=document.getElementById('objsay'); var was=b.classList.contains('on'); Array.prototype.forEach.call(document.querySelectorAll('.objchip'),function(x){x.classList.remove('on');}); if(was){ if(say)say.classList.remove('show'); } else { b.classList.add('on'); if(say){ say.textContent=OBJECTIONS[i].say; say.classList.add('show'); } } }; });
    Array.prototype.forEach.call(document.querySelectorAll('.qtier'),function(b){ b.onclick=function(){ quoteTier=+b.getAttribute('data-tier'); refreshQuote(); }; });
    var qa=document.getElementById('qaction'); if(qa)qa.onchange=function(){ quoteAction=qa.checked; refreshQuote(); };
  }

  function logOutcome(outcome){
    var q=QUEUES[MOTION]; if(!q||!q.length) return;
    flushPending();                    // commit any prior pending log before starting a new one
    var lead=q.shift(); render();      // advance immediately (never stall)
    var p={lead:lead, outcome:outcome, motion:MOTION};
    pendingLog=p;
    p.timer=setTimeout(function(){ if(pendingLog===p){ pendingLog=null; commitLog(p); } }, 5000);
    toastUndo(outcome==='won'?'Boom. Closed.':(outcome==='interested'?'Nice. Logged as interested.':'Logged. Next up.'));
  }

  boot();
})();
</script>
</body>
</html>
