<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dialer — Staffify Sales</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="/favicon.ico?v=2" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg:#050507; --white:#fff; --cyan:#1abde1; --cyan-hi:#5fe0fa; --cyan-dark:#0d82b8; --muted:#9ba1ab; --card:rgba(255,255,255,0.035); --card-border:rgba(255,255,255,0.09); --green:#1d9e75; --green-hi:#7ef5c2; }
        .grad { background: linear-gradient(100deg, var(--cyan-hi) 0%, var(--cyan) 45%, var(--cyan-dark) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; }
        .eyebrow { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: 0.3em; color: var(--cyan); text-transform: uppercase; margin-bottom: 14px; }
        .eyebrow::before { content: ''; width: 30px; height: 2px; background: linear-gradient(90deg, var(--cyan), transparent); }
        .chip { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--cyan); border: 1px solid rgba(26,189,225,0.4); background: rgba(26,189,225,0.08); border-radius: 999px; padding: 6px 14px; }
        .chip-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; }
        body { font-family:"Inter",-apple-system,sans-serif; background: radial-gradient(1000px 600px at 90% -5%, rgba(26,189,225,0.08), transparent 60%), radial-gradient(800px 600px at -10% 40%, rgba(13,86,164,0.10), transparent 55%), var(--bg); color:var(--white); line-height:1.5; -webkit-font-smoothing:antialiased; min-height:100vh; }
        .topbar { position:sticky; top:0; z-index:10; background:rgba(5,5,7,0.9); backdrop-filter:blur(12px); border-bottom:1px solid var(--card-border); padding:12px 22px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; }
        .topbar img { height:22px; }
        .nav { display:flex; gap:5px; flex-wrap:wrap; }
        .nav a { font-size:13px; font-weight:700; color:var(--muted); text-decoration:none; padding:7px 13px; border-radius:999px; }
        .nav a.active { color:var(--cyan-hi); background:rgba(26,189,225,0.10); }
        @media (max-width: 880px) { .topbar { flex-wrap: wrap; } .nav { order: 3; flex-basis: 100%; justify-content: center; margin-top: 6px; } }
        .tb-right { display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); }
        .btn { font-size:13px; font-weight:700; color:#04222b; background:var(--cyan); border:none; border-radius:999px; padding:8px 15px; cursor:pointer; text-decoration:none; }
        .btn-ghost { background:transparent; color:var(--muted); border:1px solid var(--card-border); }
        .wrap { max-width:1560px; margin:0 auto; padding:22px clamp(16px, 3vw, 40px); }
        /* Three panes: what the rep DOES, what the rep SAYS, and the tools they reach for mid-call.
           They fold down as the screen narrows so a phone still gets one clean column. */
        .cardgrid { display:grid; gap:24px; align-items:start;
                    grid-template-areas: "main" "side" "tools"; }
        .cardgrid > div { min-width:0; }
        .cardmain { grid-area:main; }
        .cardside { grid-area:side; }
        .cardtools { grid-area:tools; }
        @media (min-width:1000px){
          .cardgrid { grid-template-columns:1.02fr 1fr; grid-template-areas:"main side" "tools side"; }
          .card { padding:24px 26px 22px; }
        }
        @media (min-width:1400px){
          .cardgrid { grid-template-columns:0.95fr 1.05fr 0.9fr; grid-template-areas:"main side tools"; }
        }
        .toprow { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
        .motions { display:flex; gap:6px; }
        .motions button { font-size:13.5px; font-weight:700; color:var(--muted); background:var(--card); border:1px solid var(--card-border); border-radius:999px; padding:8px 16px; cursor:pointer; }
        .motions button.on { color:#04222b; background:var(--cyan); border-color:var(--cyan); }
        .motions button.hot { color:#ffb59a; border-color:rgba(226,90,60,0.55); }
        .motions button.hot.on { color:#3a0f0c; background:#ff8a6b; border-color:#ff8a6b; }
        .stats { display:flex; gap:16px; font-size:12.5px; color:var(--muted); }
        .stats b { color:var(--white); font-weight:800; }
        .card { background:var(--card); border:1px solid var(--card-border); border-radius:18px; padding:26px 26px 22px; }
        .company { font-size:30px; font-weight:900; letter-spacing:-0.02em; line-height:1.1; }
        .sub { font-size:14px; color:var(--muted); margin-top:4px; }
        .phone { display:flex; align-items:center; gap:12px; margin:18px 0; }
        .phone a { font-size:30px; font-weight:900; letter-spacing:-0.01em; color:var(--cyan-hi); text-decoration:none; }
        .phone .call { font-size:13px; font-weight:800; color:#04222b; background:var(--green-hi); border-radius:999px; padding:8px 16px; text-decoration:none; }
        .lbl { font-size:13.5px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--cyan); margin:18px 0 8px; }
        .fault { margin-top:10px; background:rgba(255,170,60,0.08); border:1px solid rgba(255,170,60,0.35); border-radius:12px; padding:11px 14px; font-size:14.5px; color:#ffd9a0; }
        .fault > span { display:block; font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#c9903f; margin-bottom:5px; }
        .emailbtn { display:block; width:100%; margin-top:10px; background:rgba(26,189,225,0.12); color:#7fd8ee; border:1px solid rgba(26,189,225,0.45); border-radius:12px; padding:13px; font:inherit; font-weight:800; font-size:15px; cursor:pointer; }
        .emailbtn:hover { background:rgba(26,189,225,0.2); }
        .fresh { display:inline-block; margin-top:8px; background:rgba(45,190,120,0.12); color:#5fd39a; border:1px solid rgba(45,190,120,0.4); border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:4px 11px; }
        .touched { display:block; margin-top:8px; background:rgba(255,255,255,0.04); color:#c8cfd6; border:1px solid var(--card-border); border-radius:10px; font-size:13px; padding:8px 12px; }
        .pctag { display:inline-block; margin-top:8px; background:rgba(255,193,7,0.12); color:#ffc94d; border:1px solid rgba(255,193,7,0.35); border-radius:999px; font-size:11.5px; font-weight:800; letter-spacing:.05em; text-transform:uppercase; padding:4px 11px; }
        .step { margin-top:12px; border:1px solid var(--card-border); border-radius:12px; padding:13px 16px; background:rgba(255,255,255,0.03); }
        .step.win { border-color:rgba(45,190,120,0.45); background:rgba(45,190,120,0.07); }
        .step > span { display:block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:#9aa3ad; margin-bottom:7px; }
        .step.win > span { color:#5fd39a; }
        .step ul { margin:0; padding-left:18px; }
        .step li { font-size:14.5px; color:#dfe3e8; margin-bottom:6px; line-height:1.5; }
        .step li:last-child { margin-bottom:0; }
        .fb { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
        .fbb { font:inherit; font-size:13px; font-weight:700; padding:9px 13px; border-radius:10px; border:1px solid var(--card-border); background:rgba(255,255,255,0.04); color:#c8cfd6; cursor:pointer; }
        .fbb.ok { color:#5fd39a; border-color:rgba(45,190,120,0.4); }
        .fbb.no { color:#ff8a7a; border-color:rgba(255,110,90,0.4); }
        .fbb[disabled] { opacity:.4; cursor:default; }
        .fbmsg { font-size:13px; font-weight:700; color:#5fd39a; }
        .brief { font-size:15.5px; color:#dfe3e8; background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-radius:12px; padding:14px 16px; }
        .rolebox { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:14px 0 2px; padding:12px 16px;
                   background:rgba(26,189,225,0.07); border:1px solid rgba(26,189,225,0.3); border-radius:12px; }
        .rolebox .rl { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); }
        .rolebox .rv { font-size:19px; font-weight:800; letter-spacing:-.01em; color:#eaf6fb; line-height:1.2; }
        .metarow { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
        .metatag { font-size:11.5px; font-weight:600; color:var(--muted); background:rgba(255,255,255,0.04);
                   border:1px solid var(--card-border); border-radius:999px; padding:3px 10px; }
        .prov .ps { display:flex; align-items:baseline; gap:10px; padding:7px 0; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; }
        .prov .ps:last-child { border-bottom:none; }
        .prov .ps b { min-width:96px; color:#fff; font-weight:700; font-size:12px; }
        .prov .ps span { flex:1; color:var(--muted); }
        .prov .ps i { font-style:normal; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
                      color:var(--green-hi); background:rgba(29,158,117,0.14); border:1px solid rgba(29,158,117,0.35);
                      border-radius:999px; padding:2px 8px; white-space:nowrap; }
        .prov .ps i.bad { color:#ffb59a; background:rgba(226,90,60,0.12); border-color:rgba(226,90,60,0.4); }
        .prov .pf { font-size:12.5px; color:#ffb59a; padding:6px 0; }
        .track { margin-top:6px; }
        .tstep { display:grid; grid-template-columns:26px 1fr; gap:10px; }
        .tstep .tdot { display:flex; flex-direction:column; align-items:center; }
        .tstep .tnum { width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center;
                       justify-content:center; font-size:11px; font-weight:900; color:#04222b; background:var(--cyan); }
        .tstep .tline { flex:1; width:2px; background:var(--card-border); margin:4px 0; min-height:10px; }
        .tstep:last-child .tline { display:none; }
        .tstep .tbody { padding-bottom:14px; }
        .tstep .tsay { font-size:15.5px; font-weight:600; color:#eaf6fb; line-height:1.45; }
        .tstep .tnote { font-size:13px; color:var(--muted); margin-top:3px; }
        .tstep.key .tnum { background:var(--green-hi); }
        .tstep.key .tsay { color:#d8fff0; }
        .keytag { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
                  color:#04222b; background:var(--green-hi); border-radius:999px; padding:2px 8px; margin-bottom:5px; }
        .tif { display:flex; gap:8px; margin-top:7px; font-size:13px; color:#cfd4da; }
        .tif b { flex-shrink:0; font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
                 color:var(--cyan-hi); background:rgba(26,189,225,0.10); border:1px solid rgba(26,189,225,0.3);
                 border-radius:999px; padding:2px 9px; height:fit-content; }
        /* live guided call */
        .guide { background:linear-gradient(160deg, rgba(26,189,225,0.10), rgba(13,86,164,0.05)); border:1px solid rgba(26,189,225,0.35);
                 border-radius:16px; padding:18px 20px 16px; margin-top:6px; }
        .gstep { font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; color:var(--cyan); }
        .gsay { font-size:20px; font-weight:700; line-height:1.35; color:#eaf6fb; margin:8px 0 4px; }
        .gsay.small { font-size:16.5px; font-weight:600; }
        .gnote { font-size:13px; color:var(--muted); line-height:1.45; }
        .gopts { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
        .gopt { text-align:left; font-size:14.5px; font-weight:700; color:#eaf6fb; background:rgba(255,255,255,0.05);
                border:1px solid var(--card-border); border-radius:11px; padding:12px 14px; cursor:pointer; }
        .gopt:hover { border-color:var(--cyan); background:rgba(26,189,225,0.10); }
        .gopt.win { color:#04222b; background:var(--green-hi); border-color:var(--green-hi); }
        .gopt.dead { color:var(--muted); }
        .gback { margin-top:12px; font-size:12.5px; color:var(--muted); background:none; border:none; cursor:pointer; padding:0; text-decoration:underline; }
        .gwin { font-size:15px; font-weight:700; color:#7ef5c2; }
        .pre { background:rgba(255,255,255,0.03); border:1px solid var(--card-border); border-left:3px solid var(--cyan);
               border-radius:12px; padding:14px 16px; margin-top:6px; }
        .pre .pl { display:flex; gap:10px; padding:5px 0; font-size:14px; color:#dfe3e8; line-height:1.45; }
        .pre .pl b { flex-shrink:0; min-width:84px; font-size:11.5px; font-weight:800; letter-spacing:.1em;
                     text-transform:uppercase; color:var(--cyan); padding-top:3px; }
        .pre .pl.warn { color:#ffb59a; }
        .oc.sel { border-color:var(--cyan); background:rgba(26,189,225,0.18); color:#fff; box-shadow:0 0 0 1px var(--cyan) inset; }
        .oc.sel::after { content:' \2713'; font-weight:900; }
        .notesbox { margin-top:14px; }
        .notesbox textarea { width:100%; min-height:74px; resize:vertical; font-family:inherit; font-size:14.5px;
                             line-height:1.5; color:#eaf6fb; background:rgba(255,255,255,0.04);
                             border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; }
        .notesbox textarea:focus { outline:none; border-color:var(--cyan); background:rgba(26,189,225,0.06); }
        .notesbox .nhint { font-size:12.5px; color:var(--muted); margin-top:6px; }
        .notesbox .nhint b { color:var(--cyan-hi); font-weight:700; }
        .confirmrow { display:flex; justify-content:flex-end; align-items:center; gap:12px; margin-top:14px; }
        .confirmrow .cnote { font-size:12.5px; color:var(--muted); }
        .confirmbtn { font-size:15px; font-weight:800; color:#04222b; background:var(--green-hi); border:none;
                      border-radius:12px; padding:13px 22px; cursor:pointer; }
        .confirmbtn:hover { filter:brightness(1.06); }
        .headrow { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
        .backbtn { flex-shrink:0; font-size:12.5px; font-weight:700; color:var(--muted); background:transparent;
                   border:1px solid var(--card-border); border-radius:999px; padding:7px 13px; cursor:pointer; }
        .backbtn:hover { color:#fff; border-color:var(--cyan); }
        .navbtns { display:flex; gap:8px; flex-shrink:0; }
        .srchwrap { position:relative; margin-bottom:14px; }
        .srch { width:100%; font-family:inherit; font-size:14.5px; color:#fff; background:rgba(255,255,255,0.05);
                border:1px solid var(--card-border); border-radius:12px; padding:12px 14px; }
        .srch:focus { outline:none; border-color:var(--cyan); }
        .srchres { position:absolute; left:0; right:0; top:calc(100% + 6px); z-index:20; background:#0d1418;
                   border:1px solid var(--card-border); border-radius:12px; overflow:hidden; max-height:320px; overflow-y:auto; }
        .srchres button { display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer;
                          padding:11px 14px; border-bottom:1px solid rgba(255,255,255,0.06); color:#eaf6fb; }
        .srchres button:hover { background:rgba(26,189,225,0.12); }
        .srchres .sc { font-size:14px; font-weight:700; }
        .srchres .sm { font-size:12px; color:var(--muted); margin-top:2px; }
        .srchres .none { padding:12px 14px; font-size:13.5px; color:var(--muted); }
        .hist { display:flex; flex-direction:column; gap:8px; }
        .htouch { display:flex; flex-direction:column; gap:3px; max-width:90%; padding:9px 12px; border-radius:12px; }
        .htouch.out { align-self:flex-start; background:rgba(255,255,255,0.04); border:1px solid var(--card-border); }
        .htouch.in { align-self:flex-end; background:rgba(29,158,117,0.14); border:1px solid rgba(126,245,194,0.35); }
        .htouch .hwho { font-size:11px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
        .htouch .htext { font-size:14.5px; color:#eaf6fb; line-height:1.45; }
        .hstat { font-size:11px; color:var(--cyan-hi); background:rgba(26,189,225,0.10); border:1px solid rgba(26,189,225,0.35); border-radius:999px; padding:2px 9px; margin-left:8px; text-transform:none; letter-spacing:0; font-weight:600; }
        .ammorow { display:flex; gap:8px; flex-wrap:wrap; }
        .ammo { font-size:13px; font-weight:700; color:var(--cyan-hi); background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.35); border-radius:999px; padding:8px 14px; text-decoration:none; }
        .ammo:hover { background:rgba(26,189,225,0.16); }
        .say { font-size:17px; font-weight:600; color:#eaf6fb; background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.35); border-radius:12px; padding:16px 18px; line-height:1.5; }
        .say .line { margin-bottom:8px; } .say .line:last-child { margin-bottom:0; }
        details { margin-top:14px; border:1px solid var(--card-border); border-radius:12px; padding:0 16px; background:rgba(255,255,255,0.02); }
        summary { cursor:pointer; font-size:13.5px; font-weight:700; color:var(--cyan-hi); padding:13px 0; list-style:none; }
        summary::-webkit-details-marker { display:none; }
        .script { font-size:14px; color:#cfd4da; padding-bottom:14px; }
        .script b { color:var(--white); }
        .script .blk { margin-bottom:12px; white-space:pre-wrap; }
        .outcomes { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-top:22px; }
        @media (max-width:560px){ .outcomes { grid-template-columns:1fr 1fr; } .company,.phone a{font-size:26px;} }
        .oc { font-size:14.5px; font-weight:800; border:1px solid var(--card-border); border-radius:12px; padding:15px 10px; cursor:pointer; background:var(--card); color:var(--white); }
        .oc:hover { border-color:var(--cyan); }
        .oc.good { background:rgba(29,158,117,0.16); border-color:rgba(29,158,117,0.5); color:var(--green-hi); }
        .oc.warm { background:rgba(26,189,225,0.10); border-color:rgba(26,189,225,0.4); color:var(--cyan-hi); }
        .nextbtn { width:100%; margin-top:12px; font-size:14.5px; font-weight:800; color:var(--cyan-hi); background:rgba(26,189,225,0.08); border:1px solid rgba(26,189,225,0.35); border-radius:12px; padding:14px; cursor:pointer; }
        .nextbtn:hover { background:rgba(26,189,225,0.16); }
        .txtwrap { margin-top:12px; }
        .txtbtn { width:100%; font-size:14.5px; font-weight:800; color:#04222b; background:var(--green-hi);
                  border:none; border-radius:12px; padding:14px; cursor:pointer; }
        .txtbtn:hover { filter:brightness(1.05); }
        .txtbtn:disabled { opacity:.6; cursor:default; }
        .sentwrap { margin-top:14px; }
        .sentlbl { display:block; font-size:11.5px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
                   color:var(--muted); margin-bottom:8px; }
        .sentrow { display:flex; gap:10px; }
        .sentbtn { flex:1; font-size:14.5px; font-weight:800; color:var(--white); background:var(--card);
                   border:1px solid var(--card-border); border-radius:12px; padding:14px 10px; cursor:pointer; }
        .sentbtn:hover { border-color:var(--green); background:rgba(29,158,117,0.12); color:var(--green-hi); }
        .sentbtn:disabled { opacity:.55; cursor:default; border-color:var(--card-border); color:var(--muted);
                            background:var(--card); }
        .calbtn { width:100%; font-size:14.5px; font-weight:800; color:#04222b; background:var(--cyan);
                  border:none; border-radius:12px; padding:14px; cursor:pointer; }
        .calbtn:hover { background:var(--cyan-hi); }
        .txtprev { margin-top:8px; font-size:13px; color:#cfd4da; background:rgba(255,255,255,0.03);
                   border:1px solid var(--card-border); border-left:2px solid var(--green-hi);
                   border-radius:10px; padding:10px 12px; line-height:1.45; }
        .txtprev span { display:block; font-size:11.5px; font-weight:800; letter-spacing:.12em;
                        text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
        .gate, .empty { max-width:440px; margin:70px auto; text-align:center; }
        .gate { background:var(--card); border:1px solid var(--card-border); border-radius:16px; padding:32px 28px; }
        .gate h2, .empty h2 { font-size:22px; font-weight:900; margin-bottom:10px; }
        .gate p, .empty p { color:var(--muted); font-size:14.5px; margin-bottom:18px; }
        .gate input { width:100%; font-family:inherit; font-size:15px; color:var(--white); background:rgba(255,255,255,0.05); border:1.5px solid var(--card-border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
        .gate .btn { width:100%; padding:13px; }
        .err { color:#ff9a8d; font-size:13px; min-height:18px; }

      rows.push([L.priorCall?'They asked for':'Open role', '<span class="v big">'+esc(L.role)+'</span>', 'big']);
    }

    if(L.priorCall) rows.push(['We spoke', (L.lastCall? esc(L.lastCall)+', and never followed up properly' : 'previously, and never followed up properly'), '']);
    if(L.employees) rows.push(['Size', esc(L.employees)+' employees', '']);

    // The single line that tells the rep what to actually do on this call.
    var angle='';
    if(MOTION==='websites') angle='Ask if they have checked whether they show up when someone asks AI to find a '+(L.industry||'business like theirs')+'. Nobody knows the answer, which is the opening.';
    else if(L.priorCall) angle='Do not re-pitch. Ask straight out if there is any way we can earn their business, then stop talking and listen to why it stalled.';
    else if(ONSITE_ROLE.test(L.role||'')) angle='Sounds on-site, so get them to picture it remote before anything else. Most of that job is phones, scheduling and insurance follow-up.';
    else if(L.role) angle='Already a remote-friendly role, so go straight at what they are paying.';
    if(angle) rows.push(['Angle', esc(angle), '']);

    var low=(L.sources||[]).filter(function(x){ return /low/i.test(x.trust||''); }).map(function(x){ return x.field; });
    if(low.length) rows.push(['Unverified', esc(low.join(', ')+' is a guess, do not quote it as fact.'), 'warn']);
    (L.flags||[]).slice(0,2).forEach(function(f){ rows.push(['Heads up', esc(f), 'warn']); });

    if(!rows.length) return '';
    return '<div class="lead-panel">'+rows.map(function(r){
      return '<div class="lp-row '+(r[2]==='warn'?'warn':'')+'"><span class="k">'+r[0]+'</span>'+
             (r[2]==='big'? r[1] : '<span class="v">'+r[1]+'</span>')+'</div>';
    }).join('')+'</div>';
  }

  // Everything worth knowing in the five seconds before the phone rings.
  function preCall(L){
    var rows=[];
    var who=[L.name, (L.title||'')].filter(Boolean).join(' · ');
    if(who) rows.push(['Calling', who]);
    // A prior sales call is not a job posting we found. They sat with us and told us what they
    // wanted, then did not buy. Framing that as "they posted" and "go at what they are paying"
    // is the cold-lead angle and it is wrong on this call.
    if(L.priorCall){
      if(L.role) rows.push(['They asked us for', L.role]);
      if(L.lastCall) rows.push(['We spoke', L.lastCall + ', and never followed up properly']);
      rows.push(['Angle', 'Do not re-pitch. Ask straight out if there is any way we can earn their business and fill that seat, then stop talking and listen to why it stalled.']);
    } else {
      if(L.role) rows.push(['They posted', L.role + (L.employees? ' · '+L.employees+' employees' : '')]);
      if(ONSITE_ROLE.test(L.role||'')) rows.push(['Angle', 'Sounds on-site, so get them to picture it remote before anything else. Most of that job is phones, scheduling and insurance follow-up.']);
      else if(L.role) rows.push(['Angle', 'Already a remote-friendly role, so go straight at what they are paying.']);
    }
    var hist=(L.history&&L.history.length)?L.history:null;
    if(hist) rows.push(['Heads up', 'You have already texted this one. Reference it, do not start cold.']);
    var low=(L.sources||[]).filter(function(x){ return /low/i.test(x.trust||''); }).map(function(x){ return x.field; });
    if(low.length) rows.push(['Unverified', low.join(', ')+' is a guess, do not quote it as fact.']);
    (L.flags||[]).slice(0,2).forEach(function(f){ rows.push(['Flag', f]); });
    if(!rows.length) return '';
    return '<div class="lbl">Before you dial</div><div class="pre">'+rows.map(function(r){
      var warn=(r[0]==='Unverified'||r[0]==='Flag')?' warn':'';
      return '<div class="pl'+warn+'"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span></div>';
    }).join('')+'</div>';
  }

  // Live guided call. The rep taps what the prospect actually said and is told the next thing to say,
  // so there is no place to get lost and no response without an answer.
  var FLOW=null, flowAt='open', flowHist=[];

  function buildFlow(L){
    var role=L.role||'that role', first=firstNameOf(L.name)||'', onsite=ONSITE_ROLE.test(role);
    var afterOwner = onsite ? 'pivot' : 'rate';
    return {
      open:{ step:'Open', say:'"Hi'+(first?' '+first:'')+', are you still hiring for the '+role+' role?"',
        note:'Light and quick. You are just checking, not selling.',
        opts:[['Yes, still open',afterOwner==='pivot'?'owner':'owner'],['They filled it','filled'],['"Who is this?"','whois'],['Gatekeeper / not them','gate']] },

      whois:{ step:'Who is this', say:'"It is '+(firstNameOf(ME&&ME.name)||'me')+', I came across your '+role+' posting. Are you still looking to fill it?"',
        note:'Answer plainly and put the question straight back.', opts:[['Yes, still open','owner'],['They filled it','filled']] },

      gate:{ step:'Gatekeeper', say:'"Totally get it. It is a two minute question only the person doing the hiring can answer. Is the owner around, or when is a good time?"',
        note:'Friendly and brief. A name and a time is a win here.', opts:[['Got a name or a time','logname'],['Hard no','end']] },

      owner:{ step:'Decision maker', say:'"Are you the one handling that hire, or is that someone else?"',
        note:'Find this out BEFORE you pitch. Wrong person, get a name and move on.',
        opts:[['It is them',afterOwner],['Someone else','getname']] },

      getname:{ step:'Get the name', say:'"No problem, who would be the best person to ask about it?"',
        note:'Get a name, then ask to be put through or for the best time to reach them.',
        opts:[['Got the name','logname'],['They will not say','end']] },

      logname:{ step:'Log it', outcome:'callback', say:'Write the name and the best time in your notes, then thank them and get off the line.',
        note:'A named decision maker is a real outcome, so this logs as a callback automatically.', opts:[] },

      filled:{ step:'Role is filled', say:'"Got it. What else are you trying to get covered right now?"',
        note:'The only question that can still produce a deal today.',
        opts:[['They named another need','rate'],['Nothing right now','benchmark']] },

      benchmark:{ step:'Get the number anyway', outcome:'not_interested', say:'"All good. What did you end up paying for that one?"',
        note:'The number is worth having, it opens your next call. Logging this one as closed out.', opts:[] },

      pivot:{ step:'THE PIVOT', key:true, say:'"Would you be open to that role being filled remotely, if the right person could do the work?"',
        note:'Ask this early. They are picturing someone at the front desk, so nothing else lands until they can picture it remotely.',
        opts:[['Open to it / maybe','rate'],['"It has to be in person"','split'],['Hard no on remote','softno']] },

      split:{ step:'Split the job', say:'"Fair. What does that person actually spend the day on?"',
        note:'Then split it: phones, scheduling, insurance verification, recalls and follow-ups are all remote work. Only the clipboard needs a body. Offer to cover the remote 80 percent.',
        opts:[['They are listening','rate'],['Still a no','softno']] },

      softno:{ step:'Leave the door open', say:'"Understood. If it ever gets hard to fill, we place these remote for about half. Can I send you one profile so you have it?"',
        note:'Do not push. The profile is a low-cost yes that keeps you in the game.',
        opts:[['They will take the profile','email'],['No thanks','end']] },

      rate:{ step:'Their number first', say:'"What are you paying for it right now?"',
        note:'Always get THEIR number before you give yours.',
        opts:[['They gave a number','react'],['They will not say','range']] },

      range:{ step:'Give a range instead', say:'"Ballpark, is it closer to twenty an hour or thirty?"',
        note:'An easy either-or usually gets an answer where an open question did not.',
        opts:[['Got a number','react'],['Still nothing','value']] },

      react:{ step:'React, every time', key:true, say:'"Oh wow. That is quite a bit."',
        note:'Whatever they said, react the same way. Let it sit for a beat before you say anything else.',
        opts:[['Said it','value']] },

      value:{ step:'The frame', say:'"Most of our clients fill that exact role for 30 to 60 percent less. Our average client pays about $12.90 an hour, all in."',
        note:'Say it and stop talking. Do not stack more on top.',
        opts:[['They are interested','email'],['"How is that possible?"','why'],['"Overseas? Not sure"','overseas'],['"Too good to be true"','why']] },

      why:{ step:'Why it works', say:'"It is the labor market, not corner cutting. Same work, different cost base. And every placement is backed by a lifetime replacement guarantee."',
        note:'Honest and short. Then go straight back to the ask.', opts:[['Makes sense','email'],['Still unsure','overseas']] },

      overseas:{ step:'The offshore worry', say:'"That is fair. We screen 150 to 250 people per role and you only meet the top 3, after a paid skills test on real work. If anyone is ever not right, we replace them free, for life."',
        note:'Name the fear, answer it once, move on.', opts:[['Reassured','email'],['Not for us','softno']] },

      email:{ step:'THE ASK', key:true, say:'"Let me send you a profile of someone we placed in a role like this, so you can see the caliber. What is the best email?"',
        note:'The profile earns the email. Do not try to close the placement on this call.',
        opts:[['Got the email','book'],['They hesitated','softask']] },

      softask:{ step:'Lower the bar', say:'"No commitment at all, just so you can see who we are putting in front of people. What is the best email?"',
        note:'It is one profile, not a proposal. Make it easy to say yes.',
        opts:[['Got the email','book'],['Still no','end']] },

      book:{ step:'Book the meeting', key:true, say:'"Perfect, sending that over. Let us grab 15 minutes so I can walk you through how we would fill your '+role+'. Earlier or later in the week?"',
        note:'This is the whole point of the call. Do not hang up without a time.',
        opts:[['Booked a time','won'],['"Just send it for now"','pushback']] },

      pushback:{ step:'One nudge', say:'"Happy to. Let us still hold 15 minutes so it does not get lost in your inbox, I will walk you through it live."',
        note:'One nudge only. If it is still no, take the email and follow up.',
        opts:[['Booked it','won'],['Email only','end']] },

      won:{ step:'Booked', win:true, outcome:'interested', say:'Meeting booked. Logging it as Interested and moving you on.',
        note:'Send the profile now, while you are still on the line if you can. Undo is in the toast if you mis-tapped.', opts:[] },

      end:{ step:'Wrap', say:'Log the outcome below and move to the next call.',
        note:'Every call ends with a logged outcome. That is what feeds your scoreboard and the follow-up text.', opts:[] }
    };
  }

  function renderGuide(L){
    if(!FLOW) { FLOW=buildFlow(L); FLOW.__id=L.id; flowAt='open'; flowHist=[]; }
    var n=FLOW[flowAt]||FLOW.open;
    var opts=(n.opts||[]).map(function(o,i){
      return '<button class="gopt'+(o[1]==='won'?' win':'')+'" data-go="'+esc(o[1])+'">'+esc(o[0])+'</button>';
    }).join('');
    var back=flowHist.length?'<button class="gback" data-goback="1">Back a step</button>':'';
    return '<div class="lbl">Guided call'+(n.key?' &middot; do not skip this':'')+'</div><div class="guide">'+
      '<div class="gstep">'+esc(n.step||'')+'</div>'+
      '<div class="'+(n.win?'gsay small gwin':'gsay')+'">'+esc(n.say)+'</div>'+
      (n.note?'<div class="gnote">'+esc(n.note)+'</div>':'')+
      (opts?'<div class="gopts">'+opts+'</div>':'')+back+'</div>';
  }

  // A terminal step logs itself, so the rep never has to remember. It routes through logOutcome,
  // which keeps the 5 second undo, so a mis-tap is still recoverable.
  var autoLogged={};
  function maybeAutoLog(L){
    if(!FLOW) return;
    var n=FLOW[flowAt]; if(!n||!n.outcome) return;
    var k=(L&&L.id)+'|'+flowAt; if(autoLogged[k]) return;
    autoLogged[k]=true;
    selOutcome=n.outcome; setTimeout(function(){ render(); }, 250);   // pre-select it, the rep still confirms
  }

  function wireGuide(){
    Array.prototype.forEach.call(document.querySelectorAll('.gopt'),function(b){
      b.onclick=function(){ flowHist.push(flowAt); flowAt=b.getAttribute('data-go'); render(); };
    });
    var bk=document.querySelector('[data-goback]');
    if(bk) bk.onclick=function(){ if(flowHist.length){ flowAt=flowHist.pop(); render(); } };
  }

  function roadTrack(L){
    var role = L.role || 'that role';
    var first = firstNameOf(L.name);
    var onsite = ONSITE_ROLE.test(role);
    var steps = [];

    steps.push({ say:'"Hi'+(first?' '+esc(first):'')+', are you still hiring for the '+esc(role)+' role?"',
                 note:'Light and quick. You are just checking, not selling yet.',
                 ifs:[['Filled','"Got it. What else are you trying to get covered right now?" If nothing: "What did you end up paying for that one?" The number is worth having, and it opens the next call.']] });

    steps.push({ say:'"Are you the one handling that hire, or is that someone else?"',
                 note:'Find this out before you pitch. Wrong person, get a name and move on.',
                 ifs:[['Not them','"Who would be the best person to ask about it?" Get a name and the best time.']] });

    if (onsite) {
      steps.push({ key:true, tag:'The pivot',
        say:'"Would you be open to that role being filled remotely, if the right person could do the work?"',
        note:'Ask this EARLY. They are picturing a person at the front desk, so nothing else lands until they can picture it remotely.',
        ifs:[
          ['If no','"Fair. What does that person actually spend the day on?" Then split it: phones, scheduling, insurance verification, recalls and follow-ups are all remote work. Only the clipboard needs a body.'],
          ['If maybe','"That is all I am asking. Let me show you what one of ours looks like."']
        ]});
    } else {
      steps.push({ say:'"Is that role open to being filled remotely?"',
                   note:'Usually a formality for this kind of role, but confirm it before you price anything.' });
    }

    steps.push({ say:'"What are you paying for it right now?"',
                 note:'Get THEIR number before you give yours.',
                 ifs:[['Every time','React: "oh wow, that is quite a bit." Let it sit, then: "most clients fill that for 30 to 60 percent less, our average is about $12.90 an hour all in."']] });

    steps.push({ key:true, tag:'The ask',
                 say:'"Let me send you a profile of someone we placed in a role like this. What is the best email?"',
                 note:'The profile earns the email. Do not try to close the placement on this call.' });

    steps.push({ say:'"And let us grab 15 minutes so I can walk you through it. Earlier or later in the week?"',
                 note:'The meeting is the only goal. Leave with a booked time.' });

    var html = steps.map(function(st,i){
      var ifs = (st.ifs||[]).map(function(x){ return '<div class="tif"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'; }).join('');
      return '<div class="tstep'+(st.key?' key':'')+'"><div class="tdot"><div class="tnum">'+(i+1)+'</div><div class="tline"></div></div>'+
        '<div class="tbody">'+(st.tag?'<div class="keytag">'+esc(st.tag)+'</div>':'')+
        '<div class="tsay">'+st.say+'</div><div class="tnote">'+esc(st.note)+'</div>'+ifs+'</div></div>';
    }).join('');

    return '<div class="lbl">The road track'+(onsite?' &middot; on-site role, pivot to remote':'')+'</div><div class="track">'+html+'</div>';
  }

  // Prior sales calls (Paul 2026-08-12). They booked once and never bought, so the job is to
  // find out what they decided and why BEFORE any number comes out. The concession is
  // $1,699 setup up front, or bake setup into the hourly rate, and it belongs only here.
  function priorBlock(L){
    if(!L.priorCall) return '';
    var dig=(L.dig||[]), offer=(L.offer||[]);
    if(!dig.length && !offer.length) return '';
    var step=function(cls,label,rows){
      if(!rows.length) return '';
      return '<div class="step'+cls+'"><span>'+esc(label)+'</span><ul>'+rows.map(function(r){return '<li>'+esc(r)+'</li>';}).join('')+'</ul></div>';
    };
    return step('','After the ask: listen, and find out where it stands',dig)+step(' win','Then tell them we can work with them',offer);
  }

  // Three buttons Paul asked for: the rep is the only one who finds out the data was wrong.
  function fbBlock(L){
    return '<div class="lbl">Was this lead any good?</div>'+
      '<div class="fb" data-id="'+esc(L.id)+'" data-motion="'+esc(MOTION)+'" data-company="'+esc(L.company||'')+'">'+
        '<button class="fbb ok" data-v="accurate">&#128077; Data was right</button>'+
        '<button class="fbb no" data-v="inaccurate">Data was wrong</button>'+
        '<button class="fbb" data-v="archive">Archive this lead</button>'+
        '<span class="fbmsg"></span></div>';
  }

  function provBlock(L){
    var src=L.sources||[], flags=L.flags||[];
    if(!src.length && !flags.length) return '';
    var rows=src.map(function(x){
      var low=/low/i.test(x.trust||'');
      return '<div class="ps"><b>'+esc(x.field||'')+'</b><span>'+esc(x.from||'')+'</span>'+
             (x.trust?'<i class="'+(low?'bad':'')+'">'+esc(x.trust)+'</i>':'')+'</div>';
    }).join('');
    var fl=flags.map(function(f){return '<div class="pf">'+esc(f)+'</div>';}).join('');
    return '<details class="prov"><summary>Where this info came from</summary><div style="padding-bottom:12px">'+rows+fl+'</div></details>';
  }

  function metaTags(L){
    var t=[];
    if(L.employees) t.push(esc(L.employees)+' employees');
    if(L.city) t.push(esc(L.city));
    if(L.source) t.push(esc(L.source));
    (L.flags||[]).slice(0,2).forEach(function(f){ t.push(esc(f)); });
    return t.map(function(x){return '<span class="metatag">'+x+'</span>';}).join('');
  }
  function firstNameOf(s){return String(s||'').trim().split(/\s+/)[0]||'';}
  // "have you done anything to show up when someone asks AI to find a ..." needs the singular,
  // and the engine sends these plural ("physical therapy clinics", "medical practices").
  function singularIndustry(ind){
    return String(ind||'')
      .replace(/\bpractices\b/i,'practice').replace(/\bclinics\b/i,'clinic')
      .replace(/\boffices\b/i,'office').replace(/\bcompanies\b/i,'company')
      .replace(/\bbusinesses\b/i,'business').replace(/\bstudios\b/i,'studio')
      .replace(/\bshops\b/i,'shop').replace(/\bcenters\b/i,'center');
  }

  function fillTokens(line, lead){
    var first=firstNameOf(lead.name);
    var you=firstNameOf(ME&&ME.name)||'[your name]';
    var m=line.match(/\(no name:\s*"([^"]+)"\)/i);
    if(m){ line = first ? line.replace(/\s*\(no name:[^)]*\)/i,'') : m[1]; }
    // The training script carries industry placeholders like "[their industry, shown on the card]".
    // They were never substituted, so a rep read the instruction out loud instead of the industry.
    var ind = String((lead && lead.industry) || '').trim();
    line = line
      .replace(/\[their industry[^\]]*\]/gi, ind || 'local businesses')
      .replace(/\[a business like theirs\]/gi, ind ? 'a ' + singularIndustry(ind) : 'a business like theirs')
      .replace(/\[industry\]/gi, ind || 'local businesses');
    return line.replace(/\[first name\]/gi, first||'there').replace(/\[company\]/gi, lead.company||'your company').replace(/\[role\]/gi, lead.role||'that role').replace(/\[you\]/gi, you);
  }

  function repGet(){try{var r=JSON.parse(localStorage.getItem('sfy_rep')||'null');if(r&&r.name)return r;}catch(e){}return null;}
  function repSet(n){n=(n||'').trim();if(!n)return null;var em=n.toLowerCase().replace(/[^a-z0-9]+/g,'.').replace(/(^\.|\.$)/g,'')+'@rep.local';var r={name:n,email:em};try{localStorage.setItem('sfy_rep',JSON.stringify(r));}catch(x){}return r;}
  function nameChip(){var r=repGet();return '<button class="btn btn-ghost" id="nm">'+(r?('Hi, '+esc(r.name.split(' ')[0])):'Set your name')+'</button>';}
  function wireChip(){var b=document.getElementById('nm');if(b)b.onclick=function(){var r=repGet();var n=prompt('Your name (shows on the scoreboard):',r?r.name:'');if(n){repSet(n);ME=repGet();tbRight.innerHTML=nameChip();wireChip();render();}};}

  var CAL=[];
  function loadCalendly(){
    fetch('/api/calendly-link/',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;})
      .then(function(j){ if(j&&j.ok&&j.events&&j.events.length){ CAL=j.events; render(); } }).catch(function(){});
  }
  // Prefill so the prospect is not retyping what the rep already knows.
  function calUrl(ev,L){
    var u=ev.url, q=[];
    if(L.name) q.push('name='+encodeURIComponent(L.name));
    if(L.email) q.push('email='+encodeURIComponent(L.email));
    return u+(q.length?((u.indexOf('?')>=0?'&':'?')+q.join('&')):'');
  }
  function bookBlock(L){
    if(!CAL.length||!L) return '';
    var ev=CAL[0];   // shortest meeting first, which is the one you book off a cold call
    var more=CAL.length>1?'<select id="calpick" style="margin-top:8px;width:100%;font:inherit;color:#fff;background:rgba(255,255,255,0.05);border:1px solid var(--card-border);border-radius:10px;padding:9px 11px">'+
      CAL.map(function(e,i){return '<option value="'+i+'">'+esc(e.name)+(e.duration?' · '+e.duration+' min':'')+'</option>';}).join('')+'</select>':'';
    return '<div class="txtwrap"><button class="calbtn" id="calbtn">Book the call &#8599;</button>'+more+
      '<div class="txtprev" style="border-left-color:var(--cyan)"><span>Opens Calendly</span>'+
      esc(ev.name+(ev.duration?' · '+ev.duration+' min':''))+', prefilled with their name'+(L.email?' and email':'')+'.</div></div>';
  }
  async function boot(){
    app.innerHTML='<div class="empty"><p>Loading your call list...</p></div>';
    ME=repGet();
    // ?rep=Madison in the link fills the name with no sign-in, so a rep can be handed a ready-to-use URL.
    try{
      var qRep=new URLSearchParams(location.search).get('rep');
      if(qRep && qRep.trim()){ repSet(qRep.trim()); ME=repGet(); }
    }catch(e){}
    // If a rep is signed in (hub magic-link session), use that identity so [your name] fills automatically.
    try{
      var meRes=await fetch('/api/auth-me',{cache:'no-store'});
      if(meRes.status===200){ var mj=await meRes.json(); if(mj&&mj.rep&&mj.rep.name){ ME={name:mj.rep.name,email:mj.rep.email||''}; try{localStorage.setItem('sfy_rep',JSON.stringify(ME));}catch(e){} } }
    }catch(e){}
    tbRight.innerHTML=nameChip(); wireChip();
    loadCalendly();
    await refresh();
  }

  async function refresh(){
    var results=await Promise.all([
      fetch('/api/call-queue?action=list&n=500',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/call-queue?action=training',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/call-queue?action=scoreboard',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/hot-leads',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
      fetch('/api/winback-leads',{cache:'no-store'}).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
    ]);
    var list=results[0]||{};
    QUEUES.websites=Array.isArray(list.websites)?list.websites:[];
    // Staffify tab: real phone-verified VA prospects from the portal first, then win-back former clients.
    QUEUES.staffing=(Array.isArray(list.staffing)?list.staffing:[]).concat((results[4]&&results[4].leads)||[]);
    QUEUES.hot=(results[3]&&results[3].leads)||[];
    (results[1]&&results[1].motions||[]).forEach(function(m){TRAIN[m.key]=m;});
    SCORE=results[2]||null;
    if(firstLoad && QUEUES.hot.length){ MOTION='hot'; }
    firstLoad=false;
    render();
  }

  // ============ CLOSING COCKPIT ============
  var OBJECTIONS=[
    {label:'“Too expensive”', say:'Compared to what? A US admin runs $4,500 to $6,500 a month fully loaded. Ours is about $2,200 a month all in, payroll, HR and benefits included. Onboarding is a one-time $2,099 if you decide today, and it is financeable at zero interest. What would getting this off your plate be worth to you?'},

        renderObjections()+
        '</div><div class="cardside">'+
        ctx+rec+trans+cp+
        '</div></div>'+
      '</div>';
    wire();
  }

  // Wrong or archived leads leave the rep's queue for good, so a bad lead is never handed
  // out twice. Right ones tell us the pipeline that produced them is working.
  function sendFeedback(btn){
    var box=btn.parentNode, v=btn.getAttribute('data-v');
    var q=QUEUES[MOTION], L=q&&q[0]; if(!L) return;
    Array.prototype.forEach.call(box.querySelectorAll('.fbb'),function(x){ x.disabled=true; });
    var msg=box.querySelector('.fbmsg'); msg.textContent='Saving...';
    fetch('/api/call-queue?action=feedback',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:L.id, motion:MOTION, company:L.company||'', verdict:v, source:L.source||'', rep:(repGet()||{}).name||''})})
      .then(function(r){ if(!r.ok) throw new Error('failed'); return r.json(); })
      .then(function(){
        if(v==='accurate'){ msg.textContent='Thanks, logged.'; return; }
        toast(v==='archive'?'Archived. You will not see it again.':'Flagged as bad data. Pulled from your list.');
        QUEUES[MOTION]=q.slice(1); render();
      })
      .catch(function(){
        msg.textContent='Did not save, try again.'; msg.style.color='#ff8a7a';
        Array.prototype.forEach.call(box.querySelectorAll('.fbb'),function(x){ x.disabled=false; });
      });
  }

  function wire(){
    Array.prototype.forEach.call(document.querySelectorAll('.motions button'),function(b){ b.onclick=function(){MOTION=b.getAttribute('data-m'); render();}; });
    Array.prototype.forEach.call(document.querySelectorAll('.oc'),function(b){
      b.onclick=function(){ selOutcome=b.getAttribute('data-o'); render(); };
    });
    // Callback scheduling: presets, a picker, and the calendar links rebuild live.
    Array.prototype.forEach.call(document.querySelectorAll('.cbchip'),function(b){
      b.onclick=function(){ stashNotes(); callbackAt=presetDate(b.getAttribute('data-cb')); render(); };
    });
    var cw=document.getElementById('cbwhen');
    if(cw) cw.onchange=function(){ stashNotes(); callbackAt=cw.value; render(); };

    var si=document.getElementById('srch');
    if(si){
      si.value=SEARCH;                                   // survive a re-render without stealing focus
      si.oninput=function(){ SEARCH=si.value; drawSearch(); };   // no full render while typing
      si.onkeydown=function(e){ if(e.key==='Escape'){ SEARCH=''; si.value=''; drawSearch(); si.blur(); } };
      drawSearch();
    }
    var cb=document.getElementById('confirmNext'); if(cb) cb.onclick=function(){ confirmOutcome(); };
    var bb=document.getElementById('backLead'); if(bb) bb.onclick=function(){ goBackLead(); };
    var fb=document.getElementById('fwdLead'); if(fb) fb.onclick=function(){ goForwardLead(); };
    Array.prototype.forEach.call(document.querySelectorAll('.objchip'),function(b){ b.onclick=function(){ var i=+b.getAttribute('data-obj'); var say=document.getElementById('objsay'); var was=b.classList.contains('on'); Array.prototype.forEach.call(document.querySelectorAll('.objchip'),function(x){x.classList.remove('on');}); if(was){ if(say)say.classList.remove('show'); } else { b.classList.add('on'); if(say){ say.textContent=OBJECTIONS[i].say; say.classList.add('show'); } } }; });
    Array.prototype.forEach.call(document.querySelectorAll('.qtier:not(.fqprod)'),function(b){ b.onclick=function(){ quoteHires=QUOTE_TIERS[+b.getAttribute('data-tier')].min; refreshQuote(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.qstep'),function(b){ b.onclick=function(){ quoteHires=Math.max(1, quoteHires+(+b.getAttribute('data-step'))); refreshQuote(); }; });
    var qa=document.getElementById('qaction'); if(qa)qa.onchange=function(){ quoteAction=qa.checked; refreshQuote(); };
    Array.prototype.forEach.call(document.querySelectorAll('.fqprod'),function(b){ b.onclick=function(){ fqProd=+b.getAttribute('data-fqp'); refreshFoundryQuote(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('.fqprice'),function(b){ b.onclick=function(){
      fqPrice=+b.getAttribute('data-fqx'); fqAmt=FOUNDRY_PRICES[fqPrice].amt;
      var el=document.getElementById('fqamt'); if(el) el.value=fqAmt;
      refreshFoundryQuote(); }; });
    var fam=document.getElementById('fqamt'); if(fam)fam.oninput=function(){ refreshFoundryQuote(); };
    Array.prototype.forEach.call(document.querySelectorAll('.fbb'),function(b){ b.onclick=function(){ sendFeedback(b); }; });
    // Remember which lead is displayed, and put its notes back in the box after the rebuild.
    (function(){
      var q=QUEUES[MOTION], L=(MOTION==='hot'? (q&&q[0]) : (q&&q[0]));
      shownLeadId = L ? L.id : null;
      var el=document.getElementById('callnotes');
      if(el){ el.value = notesFor(L); el.oninput=function(){ if(shownLeadId!=null) NOTES[shownLeadId]=el.value; }; }
    })();
    wireGuide();
    if(MOTION==='staffing'){ var _q=QUEUES[MOTION]; if(_q&&_q[0]) maybeAutoLog(_q[0]); }
    var kb=document.getElementById('calbtn');
    if(kb) kb.onclick=function(){
      var q=QUEUES[MOTION], L=q&&q[0]; if(!L||!CAL.length) return;
      var pick=document.getElementById('calpick');
      var ev=CAL[pick?(+pick.value||0):0];
      window.open(calUrl(ev,L),'_blank','noopener');
      crmSync('note', L, '', 'Rep opened '+ev.name+' to book with '+(L.name||L.company||'the prospect')+'.');
      toast('Calendly opened. Book it while they are on the line.');
    };
    var eb=document.getElementById('emailbtn');
    if(eb) eb.onclick=function(){
      var q=QUEUES[MOTION]; var L=q&&q[0]; if(!L||!L.email) return;
      // Open their own mail client with it written. The rep sends it, so it comes from a real
      // person and lands as a normal one-to-one email rather than a blast.
      var first=firstNameOf(L.name);
      var sub='Quick note on the '+(L.company||'your')+' website';
      var body='Hi'+(first?' '+first:'')+',\n\n'
        +'I was looking at '+(L.company||'your site')+' and noticed something worth a minute of your time.\n\n'
        +(L.siteFault?L.siteFault+'\n\n':'')
        +'We build sites for '+(L.industry||'businesses like yours')+', and I can run a free AI-visibility audit that shows whether ChatGPT and Google actually surface you when someone nearby goes looking. No cost and no commitment.\n\n'
        +'Want me to send it over?\n\nPaul\nFoundry';
      window.open('mailto:'+encodeURIComponent(L.email)+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body),'_blank');
      eb.textContent='Email opened';
      // This email pitches the audit, so it is a real touch and belongs in the CRM. It records an
      // offer rather than a send, because the rep sends it from their own mail client and we never
      // actually learn whether they went through with it.
      var r=repGet();
      fetch('/api/deal-flow/',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({kind:'outreach', rep:(r&&r.name)||'', note:'Subject: '+sub, lead:{
          company:L.company||'', name:L.name||'', phone:L.phone||'', email:L.email||'',
          role:L.role||'', motion:L.motion||MOTION, website:L.website||''}})}).catch(function(){});
    };
    var tb=document.getElementById('txtbtn');
    if(tb) tb.onclick=function(){
      var q=QUEUES[MOTION]; var L=q&&q[0]; if(!L) return;
      var r=repGet();
      if(MOTION!=='websites' && (!r||!r.name)){ toast('Set your name first, it goes in the text.'); return; }
      tb.disabled=true; tb.textContent='Sending...';
      fetch('/api/send-text/',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({phone:L.phone, first:L.name||'', role:L.role||'', company:L.company||'', industry:L.industry||'', motion:MOTION, rep:(r&&r.name)||'', priorCall:!!L.priorCall, lastCall:L.lastCall||''})})
        .then(function(x){return x.json();})
        .then(function(j){
          if(j&&j.sent){ tb.textContent='Text sent'; toast('Text sent.'); }
          else if(j&&j.reason==='already_texted'){ tb.textContent='Already texted'; toast('This lead was already texted.'); }
          else if(j&&j.error==='not_configured'){ tb.disabled=false; tb.textContent='Text them'; toast('OpenPhone is not connected.'); }
          else { tb.disabled=false; tb.textContent='Text them'; toast('Could not send, try again.'); }
        }).catch(function(){ tb.disabled=false; tb.textContent='Text them'; toast('Network error.'); });
    };
    var cpb=document.getElementById('cpbtn'); if(cpb)cpb.onclick=function(){ if(!CURHOT||!window.StaffifyClosePlan)return; var r=repGet(); var mo=CURHOT.motion==='staffing'?'Staffify VA':(CURHOT.motion==='websites'?'Foundry website':''); StaffifyClosePlan.run({mode:'prep',transcript:CURHOT.transcript||'',name:CURHOT.name||'',company:CURHOT.company||'',grade:mo,phone:CURHOT.phone||'',rep:(r&&r.name)||''}, document.getElementById('cpout'), cpb); };
    Array.prototype.forEach.call(document.querySelectorAll('.sentbtn'),function(b){
      b.onclick=function(){
        var q=QUEUES[MOTION]; var L=(MOTION==='hot'?CURHOT:(q&&q[0])); if(!L) return;
        var kind=b.getAttribute('data-sent'); var r=repGet(); var was=b.textContent;
        b.disabled=true; b.textContent='Saving...';
        fetch('/api/deal-flow/',{method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({kind:kind, rep:(r&&r.name)||'', lead:{
            company:L.company||'', name:L.name||'', phone:L.phone||'', email:L.email||'',
            role:L.role||'', motion:L.motion||MOTION, website:L.website||''}})})
          .then(function(x){return x.json();})
          .then(function(j){
            if(j&&j.ok&&j.deal&&j.deal.id){
              b.textContent=(j.deal.created?'Deal opened':'Deal updated');
              toast(j.deal.created?'Deal opened in HubSpot.':'Deal moved to '+(j.deal.stage||'the next stage')+'.');
            } else if(j&&j.skipped){ b.textContent=was; b.disabled=false; toast('They opted out, so no deal was created.'); }
            else { b.disabled=false; b.textContent=was; toast((j&&(j.reason||j.error))||'Could not save, try again.'); }
          }).catch(function(){ b.disabled=false; b.textContent=was; toast('Network error.'); });
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.nextbtn'),function(b){ b.onclick=nextCall; });
  }

  // Renders the confirm row once an outcome is highlighted, so nothing advances until the rep agrees.
  // Quick search, for when a prospect calls back.
  // Typing must NEVER trigger a full render: rebuilding the page destroys the input mid-keystroke,
  // which drops characters and steals focus. Only the results list is redrawn.
  var SEARCH='', SEARCH_HITS=[];
  function searchBox(){
    return '<div class="srchwrap"><input class="srch" id="srch" type="search" autocomplete="off" '+
           'placeholder="Someone calling back? Search name, company, number or role">'+
           '<div class="srchres" id="srchres" style="display:none"></div></div>';
  }
  function searchHits(q){
    q=String(q||'').trim().toLowerCase();
    if(q.length<2) return [];
    var digits=q.replace(/[^0-9]/g,''), hits=[];
    ['hot','staffing','websites'].forEach(function(mk){
      (QUEUES[mk]||[]).forEach(function(l,i){
        var hay=((l.company||'')+' '+(l.name||'')+' '+(l.phone||'')+' '+(l.role||'')).toLowerCase();
        if(hay.indexOf(q)>=0 || (digits.length>=4 && String(l.phone||'').replace(/[^0-9]/g,'').indexOf(digits)>=0)) hits.push({m:mk,l:l});
      });
    });
    WORKED.forEach(function(w,wi){
      var l=w.lead, hay=((l.company||'')+' '+(l.name||'')+' '+(l.phone||'')+' '+(l.role||'')).toLowerCase();
      if(hay.indexOf(q)>=0) hits.push({m:w.motion,l:l,worked:wi});
    });
    return hits.slice(0,8);
  }
  function drawSearch(){
    var box=document.getElementById('srchres'); if(!box) return;
    SEARCH_HITS=searchHits(SEARCH);
    if(!SEARCH.trim() || SEARCH.trim().length<2){ box.style.display='none'; box.innerHTML=''; return; }
    box.style.display='block';
    box.innerHTML = SEARCH_HITS.length
      ? SEARCH_HITS.map(function(h,n){
          var sub=[h.l.role,h.l.name,h.l.phone].filter(Boolean).join(' \u00b7 ');
          return '<button data-hit="'+n+'"><span class="sc">'+esc(h.l.company||h.l.name||'Lead')+
                 (h.worked!=null?' <span style="color:#9ba1ab;font-weight:600">(already logged)</span>':'')+'</span>'+
                 '<span class="sm">'+esc(sub)+'</span></button>';
        }).join('')
      : '<div class="none">Nothing matches that.</div>';
    Array.prototype.forEach.call(box.querySelectorAll('button[data-hit]'),function(b){
      b.onclick=function(){ jumpToLead(SEARCH_HITS[+b.getAttribute('data-hit')]); };
    });
  }
  function jumpToLead(h){
    if(!h) return;
    MOTION=h.m;
    var q=QUEUES[MOTION]||[];
    if(h.worked!=null){
      var w=WORKED.splice(h.worked,1)[0];
      if(w){ w.lead.__reopened=true; q.unshift(w.lead); selOutcome=w.outcome; }
    } else {
      var idx=q.indexOf(h.l);
      if(idx>0) q.unshift(q.splice(idx,1)[0]);
      selOutcome=null;
    }
    SEARCH=''; SEARCH_HITS=[]; FLOW=null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
  }

  // Notes are typed mid-call, and every tap re-renders the card, so the textarea is read back into
  // NOTES before anything rebuilds. Losing a rep's notes is the one thing this box must never do.
  function stashNotes(){
    var el=document.getElementById('callnotes');
    if(el && shownLeadId!=null) NOTES[shownLeadId]=el.value;
  }
  function notesFor(L){ return (L && NOTES[L.id]!=null) ? NOTES[L.id] : ''; }
  function notesBlock(){
    return '<div class="notesbox"><div class="lbl">Notes from the call</div>'+
      '<textarea id="callnotes" placeholder="What did they actually say? Who owns the hire, what are they paying, when to follow up."></textarea>'+
      '<div class="nhint">Saved onto their <b>HubSpot</b> record when you hit Next lead.</div></div>';
  }

  // Where the rep is in the list, so cycling does not feel like falling through an endless stack.
  function posRow(){
    var q=QUEUES[MOTION]||[];
    var done=WORKED.filter(function(w){return w.motion===MOTION;}).length;
    var total=q.length+done;
    if(!total) return '';
    return '<div class="posrow"><span>Lead <b>'+(done+1)+'</b> of <b>'+total+'</b> in '+esc(LABEL[MOTION])+'</span>'+
           '<span>'+q.length+' left to work</span></div>';
  }

  // A callback with no reminder is a callback that does not happen. Picking Callback opens a
  // date and time, and drops it straight onto whichever calendar the rep is signed into.
  var callbackAt='';
  function pad(n){ return (n<10?'0':'')+n; }
  function localValue(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes()); }
  function presetDate(kind){
    var d=new Date();
    if(kind==='tom'){ d.setDate(d.getDate()+1); d.setHours(9,0,0,0); }
    else if(kind==='2d'){ d.setDate(d.getDate()+2); d.setHours(9,0,0,0); }
    else if(kind==='wk'){ d.setDate(d.getDate()+7); d.setHours(9,0,0,0); }
    else if(kind==='pm'){ d.setHours(d.getHours()+3,0,0,0); }
    return localValue(d);
  }
  function cbUtc(v){
    var d=new Date(v); if(isNaN(d)) return '';
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+'00Z';
  }
  function cbTitle(L){ return 'Call back '+((L&&L.company)||'lead')+((L&&L.name)?' ('+L.name+')':''); }
  function cbDetails(L){
    return [ (L&&L.role)?('Open role: '+L.role):'', (L&&L.phone)?('Phone: '+L.phone):'',
             (L&&NOTES[L.id])?('Notes: '+NOTES[L.id]):'' ].filter(Boolean).join('\n');
  }
  function gcalUrl(L){
    var st=cbUtc(callbackAt); if(!st) return '#';
    var end=new Date(new Date(callbackAt).getTime()+15*60000);
    var et=end.getUTCFullYear()+pad(end.getUTCMonth()+1)+pad(end.getUTCDate())+'T'+pad(end.getUTCHours())+pad(end.getUTCMinutes())+'00Z';
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'+
      '&text='+encodeURIComponent(cbTitle(L))+
      '&dates='+st+'/'+et+
      '&details='+encodeURIComponent(cbDetails(L));
  }
  function icsHref(L){
    var st=cbUtc(callbackAt); if(!st) return '#';
    var end=new Date(new Date(callbackAt).getTime()+15*60000);
    var et=end.getUTCFullYear()+pad(end.getUTCMonth()+1)+pad(end.getUTCDate())+'T'+pad(end.getUTCHours())+pad(end.getUTCMinutes())+'00Z';
    var ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Staffify//Dialer//EN','BEGIN:VEVENT',
      'UID:'+Date.now()+'@gostaffify.com','DTSTAMP:'+cbUtc(new Date().toString()),
      'DTSTART:'+st,'DTEND:'+et,'SUMMARY:'+cbTitle(L).replace(/[,;]/g,''),
      'DESCRIPTION:'+cbDetails(L).replace(/\n/g,'\\n').replace(/[,;]/g,''),
      'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+cbTitle(L).replace(/[,;]/g,''),
      'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n');
    return 'data:text/calendar;charset=utf-8,'+encodeURIComponent(ics);
  }
  function callbackBlock(L){
    if(selOutcome!=='callback') return '';
    if(!callbackAt) callbackAt=presetDate('tom');
    var chip=function(k,lab){ return '<button class="cbchip'+(callbackAt===presetDate(k)?' on':'')+'" data-cb="'+k+'">'+lab+'</button>'; };
    var ready=!!callbackAt;
    return '<div class="cbwrap"><div class="cbhead">When should we call back?</div>'+
      '<div class="cbchips">'+chip('pm','Later today')+chip('tom','Tomorrow 9am')+chip('2d','In 2 days')+chip('wk','Next week')+'</div>'+
      '<input type="datetime-local" id="cbwhen" value="'+esc(callbackAt)+'">'+
      (ready?'<div class="cbadd"><a href="'+gcalUrl(L)+'" target="_blank" rel="noopener" id="cbgcal">Add to Google Calendar</a>'+
             '<a class="alt" href="'+icsHref(L)+'" download="callback.ics">Apple or Outlook</a></div>':'')+
      '</div>';
  }

  function confirmRow(){
    if(!selOutcome) return '';
    var label=({won:'Closed / Won',interested:'Interested',callback:'Callback',no_answer:'No answer',
                voicemail:'Voicemail',gatekeeper:'Gatekeeper',not_interested:'Not interested',bad_number:'Bad number'})[selOutcome]||selOutcome;
    var extra=(selOutcome==='no_answer')?' A follow-up text goes out.'
             :(selOutcome==='bad_number')?' Bad data, so this lead is removed from the queue and from HubSpot.':'';
    return '<div class="confirmrow"><span class="cnote">Logging as <b>'+esc(label)+'</b>.'+extra+'</span>'+
           '<button class="confirmbtn" id="confirmNext">Next lead &#8594;</button></div>';
  }
  function navBtns(){
    var out='';
    if(WORKED.length){
      var prev=WORKED[WORKED.length-1];
      out+='<button class="backbtn" id="backLead" title="Reopen '+esc(prev.lead.company||'the last lead')+'">&#8592; Back</button>';
    }
    if(FORWARD.length){
      var nxt=FORWARD[FORWARD.length-1];
      out+='<button class="backbtn" id="fwdLead" title="Return to '+esc(nxt.lead.company||'where you were')+'">Forward &#8594;</button>';
    }
    return out?'<div class="navbtns">'+out+'</div>':'';
  }

  // Commit the highlighted outcome, then move on and put the rep back at the top of the page.
  function confirmOutcome(){
    var q=QUEUES[MOTION]; if(!q||!q.length||!selOutcome) return;
    var lead=q.shift();
    var redo = FORWARD.length && FORWARD[FORWARD.length-1].lead===lead;
    var prior = redo ? FORWARD.pop() : null;
    var changed = redo && prior.outcome!==selOutcome;
    stashNotes();
    var notes=(NOTES[lead.id]||'').trim();
    if(selOutcome==='callback' && callbackAt){
      var when=new Date(callbackAt);
      if(!isNaN(when)) notes=('Callback set for '+when.toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})+'.'+(notes?' '+notes:'')).trim();
    }
    var entry={lead:lead, outcome:selOutcome, motion:MOTION, correction:!!lead.__reopened, notes:notes};
    WORKED.push(entry);
    // Re-log only when it is genuinely new or actually changed, so stepping forward through
    // untouched leads does not spam the log with duplicates.
    if(!redo || changed) commitLog(entry);
    if(selOutcome==='no_answer' && (!redo || changed)) sendNoAnswerText(lead, (repGet()||{}).name, MOTION);
    if(!redo || changed) crmSync('call', lead, entry.outcome, notes);
    // Bad data never comes back: blacklisted here and archived in HubSpot by the sync above.
    if(entry.outcome==='bad_number') toast('Bad data. Removed from the queue and HubSpot.');
    if(!redo) FORWARD=[];                     // moving on from a fresh lead abandons the forward path
    // If more forward history remains, show that lead with what was logged on it.
    selOutcome = FORWARD.length ? FORWARD[FORWARD.length-1].outcome : null;
    callbackAt='';
    FLOW=null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    toast(changed?'Updated. Moving on.':(redo?'Back where you were.':'Logged. Next lead.'));
  }

  // Step back to correct a mistake. The re-logged outcome REPLACES what was captured before.
  function goBackLead(){
    if(!WORKED.length) return;
    var last=WORKED.pop();
    FORWARD.push(last);
    last.lead.__reopened=true;
    if(last.notes!=null) NOTES[last.lead.id]=last.notes;   // bring the notes back with the lead
    if(MOTION!==last.motion) MOTION=last.motion;
    (QUEUES[MOTION]||[]).unshift(last.lead);
    selOutcome=last.outcome;     // show what was logged so they can change it
    FLOW=null;
    render();
    window.scrollTo({top:0, behavior:'smooth'});
    toast('Reopened '+((last.lead.company||'lead'))+'. Changing it replaces the old entry.');
  }

  // Step forward again after going back. Whatever is highlighted now is what gets committed, so a
  // correction made while back is what sticks.
  function goForwardLead(){
    if(!FORWARD.length) return;
    confirmOutcome();
  }

  function logOutcome(outcome){
    var q=QUEUES[MOTION]; if(!q||!q.length) return;
    flushPending();                    // commit any prior pending log before starting a new one
    var lead=q.shift(); render();      // advance immediately (never stall)
    var p={lead:lead, outcome:outcome, motion:MOTION};
    pendingLog=p;
    p.timer=setTimeout(function(){ if(pendingLog===p){ pendingLog=null; commitLog(p); } }, 5000);
    toastUndo(outcome==='won'?'Boom. Closed.':(outcome==='interested'?'Nice. Logged as interested.':'Logged. Next up.'));
  }

  // Skip to the next call without logging. Rotates the current lead to the back so nothing is lost.
  function nextCall(){
    var q=QUEUES[MOTION]; if(!q||!q.length) return;
    flushPending();
    if(q.length<2){ toast('That is the only lead left in this list.'); return; }
    var lead=q.shift(); q.push(lead); render();
  }

  boot();
})();
</script>
</body>
