<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My day — Staffify Sales</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.ico?v=2" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/portal.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#050507;--white:#fff;--cyan:#1abde1;--cyan-hi:#5fe0fa;--cyan-dark:#0d82b8;--muted:#9ba1ab;--card:rgba(255,255,255,0.035);--card-border:rgba(255,255,255,0.09);--green:#1d9e75;--green-hi:#7ef5c2}
  body{font-family:"Inter",-apple-system,sans-serif;background:var(--bg);color:var(--white);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  .topbar{position:sticky;top:0;z-index:10;background:rgba(5,5,7,0.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--card-border);padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .topbar img{height:22px}
  .wrap{max-width:1100px;margin:0 auto;padding:26px clamp(16px,3vw,40px)}
  .eyebrow{font-size:12px;font-weight:800;letter-spacing:.3em;color:var(--cyan);text-transform:uppercase;margin-bottom:10px}
  h1{font-size:clamp(28px,4vw,40px);letter-spacing:-.02em;font-weight:800}
  .sub{color:var(--muted);font-size:15px;margin-top:6px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:26px 0}
  .stat{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:16px 18px}
  .stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .stat span{color:var(--muted);font-size:13px}
  section.card{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px 22px;margin-bottom:16px}
  h2{font-size:17px;font-weight:800;margin-bottom:4px}
  .hint{color:var(--muted);font-size:13.5px;margin-bottom:12px}
  .btn{display:inline-block;font-size:13.5px;font-weight:700;color:#04222b;background:var(--cyan);border:none;border-radius:999px;padding:9px 17px;cursor:pointer;text-decoration:none}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--card-border)}
  ul.rows{list-style:none}
  ul.rows li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--card-border);font-size:14px;flex-wrap:wrap}
  ul.rows li:last-child{border-bottom:none}
  ul.rows .who{font-weight:700}
  ul.rows .meta{color:var(--muted);font-size:13px}
  .empty{color:var(--muted);font-size:14px;padding:6px 0}
  .pill{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;border:1px solid rgba(26,189,225,.4);color:var(--cyan);background:rgba(26,189,225,.08)}
  .pill.due{border-color:rgba(255,183,77,.45);color:#ffb74d;background:rgba(255,183,77,.1)}
  .err{color:#ff9f9f;font-size:14px}
.sub-h{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:#6e6e73;margin:16px 0 6px;font-weight:650}
  .rows li .acts{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .rows li .acts a,.rows li .acts button{min-height:32px;padding:5px 11px;font-size:12.5px}
  .pill.over{background:#fdeeee;color:#8e1f2a;border-color:#e7b4b4}
  .pill.task{background:#f3e9ff;color:#5b2d9a;border-color:#dccbf3}
  .lead{font-size:15px;color:#845400;background:#fff7e5;border:1px solid #ecd8aa;border-radius:12px;padding:12px 14px;margin:0 0 16px}
</style>
</head>
<body>
<header class="topbar">
  <img src="/assets/brand/logo-blue.svg" alt="Staffify">
</header>
<div class="wrap">
  <div class="eyebrow">Your workspace</div>
  <h1 id="greeting">My day</h1>
  <p class="sub" id="sub">Loading your queue…</p>
  <div class="stats" id="stats"></div>
  <div id="panels"></div>
</div>
<script src="/assets/js/portal-shell.js"></script>
<script type="module">
// Milton, and anyone else on the caller seat, lands here. It deliberately shows ONLY their own
// work: what they promised and what is next, then what they logged. No owner finance, no other
// rep's numbers, no company totals. The server already refuses those endpoints for a caller; this
// page simply never asks for them.
//
// Paul, 2026-10-23: "the dashboard should present call backs and highest priority items first for
// the salesperson." So the first panel is Right now: callbacks due, tasks due, then the next card
// in queue order. The grouping is the same followUps() the dialer's drawer uses.
import { orderCallQueue } from '/assets/js/call-queue-order.js';
import { followUps, fmtWhen, OUTCOMES } from '/assets/js/dialer-model.js';
const $ = id => document.getElementById(id);
const el = (t, text, cls) => { const e = document.createElement(t); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
const get = async url => { const r = await fetch(url, { cache: 'no-store' }); if (!r.ok) throw Object.assign(Error('HTTP ' + r.status), { status: r.status }); return r.json(); };
const post = async (url, body) => { const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); const j = await r.json(); if (!r.ok) throw Error(j.error || 'HTTP ' + r.status); return j; };
const when = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { weekday: 'short', hour: 'numeric', minute: '2-digit' }); };
const LABEL = Object.fromEntries(OUTCOMES.map(o => [o.value, o.label]));
const linkTo = (text, href, cls = 'btn') => Object.assign(el('a', text, cls), { href });

function stat(n, label) { const d = el('div', null, 'stat'); d.append(el('b', String(n)), el('span', label)); return d; }
function panel(title, hint) { const s = el('section', null, 'card'); s.append(el('h2', title)); if (hint) s.append(el('p', hint, 'hint')); $('panels').append(s); return s; }

// One promise, as a row: who, what was agreed, when, and the way in.
function promiseRow(it, now) {
    const li = el('li'); if (Date.parse(it.at) <= now) li.className = 'over';
    const left = el('div');
    left.append(el('div', it.company || it.recipient || 'Task', 'who'));
    left.append(el('div', it.kind === 'task' ? 'Task · ' + it.title + (it.notes ? ' · ' + it.notes : '') : (LABEL[it.outcome] || it.outcome) + (it.note ? ' · ' + it.note : ''), 'meta'));
    const right = el('div', null, 'acts');
    right.append(el('span', fmtWhen(it.at, now), 'pill ' + (Date.parse(it.at) <= now ? 'over' : it.kind === 'task' ? 'task' : 'due')));
    if (it.recordId) right.append(linkTo('Open card', '/dialer/?open=' + encodeURIComponent(it.recordId), 'btn'));
    if (it.kind === 'task') {
        const done = el('button', 'Done', 'btn btn-ghost'); done.type = 'button';
        done.onclick = async () => { done.disabled = true; try { const r = await post('/api/outreach-queue/?view=calls', { action: 'task-done', taskId: it.taskId }); if (r.ok) li.remove(); else { done.disabled = false; done.textContent = 'Could not update'; } } catch { done.disabled = false; done.textContent = 'Could not update'; } };
        right.append(done);
    }
    li.append(left, right);
    return li;
}

(async () => {
    let me = null;
    try { me = (await get('/api/auth-me/')).rep; }
    catch { $('sub').textContent = 'Sign in with your Staffify account to see your day.'; $('panels').append(linkTo('Sign in', '/hub/')); return; }

    const first = String(me.name || me.email).trim().split(/\s+/)[0];
    $('greeting').textContent = `Good to see you, ${first}`;

    let queue = null, qErr = null;
    try { queue = await get('/api/outreach-queue/?view=calls'); } catch (e) { qErr = e; }
    // The shift. A caller's calls from the Hub need a running one; the header bar owns it, and this
    // page says so where the day starts, with the press right there.
    let shiftInfo = null;
    try { shiftInfo = await get('/api/shift/?me=1'); } catch { /* the bar still shows it; nothing to invent here */ }

    const now = Date.now();
    const mine = String(me.email || '').toLowerCase();
    const records = (queue && queue.records) || [];
    const owned = records.filter(r => String(r.callOwner || '').toLowerCase() === mine);
    const unclaimed = records.filter(r => r.unclaimed);
    const fu = followUps({ records, tasks: (queue && queue.tasks) || [], me: mine, now });
    const soon = [...fu.dueNow, ...fu.today];
    const nextUp = qErr ? [] : orderCallQueue(records, {}).filter(r => !soon.some(i => i.recordId === r.id)).slice(0, 3);

    // Everything this caller personally logged, newest first. The history is on the record, so
    // this needs no extra endpoint and cannot show anyone else's calls.
    const logged = records.flatMap(r => (r.callHistory || [])
        .filter(c => String(c.caller || '').toLowerCase() === mine)
        .map(c => ({ ...c, company: r.company || r.recipient })))
        .sort((a, b) => String(b.at).localeCompare(String(a.at)));
    const today = new Date().toDateString();
    const loggedToday = logged.filter(c => new Date(c.at).toDateString() === today);

    $('sub').textContent = qErr ? 'Your call queue could not be loaded just now.'
        : fu.dueNow.length ? `${fu.dueNow.length} callback${fu.dueNow.length === 1 ? '' : 's'} waiting for you. Those first.`
        : soon.length ? `${soon.length} promise${soon.length === 1 ? '' : 's'} due today. Then the queue.`
        : 'Nothing overdue. Start with the next card.';

    $('stats').append(
        stat(fu.dueNow.length, 'due now'),
        stat(fu.today.length, 'later today'),
        stat(fu.upcoming.length + fu.later.length, 'coming up'),
        stat(loggedToday.length, 'calls you logged today'),
    );

    // Right now: promises first, then the next card. The order is the dialer's own order.
    const rn = panel('Right now', 'Callbacks you promised and tasks you set, overdue first. Then the next card in the queue.');
    // One notice per state, redrawn after every press from what the server answered.
    if (shiftInfo && shiftInfo.required && shiftInfo.state !== 'on') {
        const lead = el('div', null, 'lead'); lead.id = 'shift-lead'; rn.append(lead);
        const draw = (info, ended) => {
            lead.replaceChildren();
            if (info.state === 'on') { lead.append(el('b', 'Shift running since ' + new Date(info.shift.startedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) + '. '), document.createTextNode('Numbers show on the dialer now. The clock is in the header on every page.')); return; }
            const st = info.state, action = st === 'break' ? 'resume' : st === 'stale' ? 'end' : 'start';
            if (ended && ended.status === 'needs_review') lead.append(el('b', 'Shift ended and flagged for review. '), document.createTextNode('It ran past 12 hours, so it counts nothing until an owner sets its real end time. '));
            else if (ended) lead.append(el('b', 'Shift ended. '));
            lead.append(el('b', 'Calling from the Hub needs a running shift. '), document.createTextNode(((info.gate && info.gate.message) || '') + ' Notes and outcomes still save. '));
            const go = el('button', { start: 'Start shift', resume: 'Resume shift', end: 'End this shift' }[action], 'btn'); go.type = 'button'; go.id = 'shift-lead-action';
            go.onclick = async () => {
                go.disabled = true;
                // Through the shared shift client when it is loaded, so the header and every other tab hear about it.
                const shared = window.__staffifyShift;
                try {
                    if (shared && typeof shared[action] === 'function') { const r = await shared[action](); if (!r || !r.ok) throw Error((r && r.error) || 'Not changed'); const snap = shared.snapshot(); draw({ state: snap.state, gate: { message: snap.message }, shift: snap.shift }, r.ended || null); }
                    else { const r = await post('/api/shift/', { action, page: '/my-day/' }); draw(r, r.ended || null); }
                } catch (e) { go.disabled = false; go.textContent = e.message || 'Not changed'; }
            };
            lead.append(go);
        };
        draw(shiftInfo, null);
    }
    if (qErr) rn.append(el('p', qErr.status === 401 ? 'Sign in again to load the queue.' : 'The queue is unavailable right now. Nothing has been lost.', 'err'));
    if (soon.length) { const ul = el('ul', null, 'rows'); for (const it of soon) ul.append(promiseRow(it, now)); rn.append(ul); }
    else if (!qErr) rn.append(el('p', 'No callbacks or tasks due today.', 'empty'));
    if (nextUp.length) {
        rn.append(el('h3', 'Next up', 'sub-h'));
        const ul = el('ul', null, 'rows');
        for (const r of nextUp) {
            const li = el('li'); const left = el('div');
            left.append(el('div', r.company || r.recipient, 'who'), el('div', [r.industry && r.industry.label, r.callOutcome === 'callback' ? 'Callback' : (r.sentTouches || 0) + ' emails, no reply'].filter(Boolean).join(' · '), 'meta'));
            const right = el('div', null, 'acts'); right.append(el('span', 'Ready', 'pill'), linkTo('Open card', '/dialer/?open=' + encodeURIComponent(r.id), 'btn btn-ghost'));
            li.append(left, right); ul.append(li);
        }
        rn.append(ul);
    }
    rn.append(linkTo(fu.dueNow.length ? 'Start with the callbacks' : 'Start calling', fu.dueNow.length ? '/dialer/?open=' + encodeURIComponent(fu.dueNow[0].recordId || '') : '/dialer/'));

    // Coming up: this week and later, so a promise is visible before the day it lands.
    const later = [...fu.upcoming, ...fu.later];
    if (later.length) {
        const cu = panel('Coming up', 'Promises that land later this week and beyond.');
        const ul = el('ul', null, 'rows'); for (const it of later.slice(0, 10)) ul.append(promiseRow(it, now)); cu.append(ul);
        if (later.length > 10) cu.append(el('p', `${later.length - 10} more in the dialer's follow-ups (press F).`, 'hint'));
    }

    // The pool
    const calls = panel('Team calls', qErr ? null : `${unclaimed.length} prospects are unclaimed right now and ${owned.length} are yours. Opening a card claims nothing; logging an outcome makes the follow-up yours.`);
    calls.append(linkTo('Open team calls', '/dialer/', 'btn btn-ghost'));

    // What they logged
    const recent = panel('Your recent calls', 'Only yours. Nobody else\u2019s calls appear here.');
    if (!logged.length) recent.append(el('p', 'No calls logged yet.', 'empty'));
    else {
        const ul = el('ul', null, 'rows');
        for (const c of logged.slice(0, 12)) {
            const li = el('li'); const left = el('div');
            left.append(el('div', c.company, 'who'), el('div', c.notes || 'No notes', 'meta'));
            const right = el('div'); right.append(el('span', LABEL[c.outcome] || c.outcome, 'pill'), el('div', when(c.at), 'meta'));
            li.append(left, right); ul.append(li);
        }
        recent.append(ul);
    }

    // Their own booking link, on the page they start the day from.
    if (me.bookingUrl) {
        const bk = panel('Your booking link', 'Send this when a prospect agrees to a call. It books onto your calendar, not the team one.');
        bk.append(Object.assign(linkTo('Open your Calendly', me.bookingUrl), { target: '_blank', rel: 'noopener' }));
        bk.append(el('p', me.bookingUrl, 'hint'));
    }

    // Spearhead: the CEO cohort is a different motion and is worked by name.
    const spear = records.filter(r => r.campaignId === 'staffify-tobit-outreach');
    if (spear.length) {
        const sp = panel('Spearhead accounts', `${spear.length} CEO accounts from the Tobit list. Four emails sent to each, worked one at a time by name.`);
        sp.append(linkTo('Open spearhead accounts', '/spearhead/', 'btn btn-ghost'));
    }

    // Your activity: what the Hub measured about you, and what it does not.
    try {
        const a = await get('/api/activity/?me=1');
        const ac = panel('Your shifts and Hub activity this week', 'Shifts are what you clocked with Start and End. Active time is an estimate of time with a Hub tab open and in use; it cannot see phone calls or anything outside the Hub. Neither is payroll: Hubstaff is the source for paid hours.');
        const mins = n => n >= 60 ? Math.floor(n / 60) + 'h ' + (n % 60) + 'm' : n + 'm';
        const row = el('div', null, 'stats');
        row.append(stat(mins(a.totals.clockedMinutes || 0), 'clocked on shifts' + (a.totals.shiftsNeedingReview ? ' (' + a.totals.shiftsNeedingReview + ' needs review)' : '')), stat(mins(a.totals.activeMinutes), 'active (estimate)'), stat(mins(a.totals.idleMinutes), 'idle in session'), stat(a.totals.meaningful, 'actions recorded'));
        ac.append(row);
        const timeET = iso => new Date(iso).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' });
        const shiftLine = sh => timeET(sh.startedAt) + ' to ' + (sh.correctedEndedAt ? timeET(sh.correctedEndedAt) + ' (corrected)' : sh.endedAt ? timeET(sh.endedAt) : sh.state === 'open' ? 'now' : 'never ended') + ' · ' + (sh.state === 'needs_review' || sh.state === 'open_too_long' ? 'needs review' : mins(sh.clockedMinutes) + ' clocked' + (sh.breakMinutes ? ', ' + mins(sh.breakMinutes) + ' break' : '') + (sh.state === 'open' ? ' so far' : ''));
        const ul = el('ul', null, 'rows');
        for (const d of a.days) { const li = el('li'); const left = el('div'); left.append(el('div', new Date(d.day + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }), 'who'));
            if (d.shift && d.shift.list && d.shift.list.length) left.append(el('div', 'Shift: ' + d.shift.list.map(shiftLine).join(' · '), 'meta'));
            left.append(el('div', d.measured ? `${mins(d.activeMinutes)} active · ${mins(d.idleMinutes)} idle · ${d.sessions} session${d.sessions === 1 ? '' : 's'} · ${d.meaningful} action${d.meaningful === 1 ? '' : 's'}` : 'Not measured (before tracking started, or no Hub use)', 'meta')); li.append(left); ul.append(li); }
        ac.append(ul, linkTo('See your events', '/activity/', 'btn btn-ghost'));
        const what = el('details'); what.append(el('summary', 'What is measured'));
        for (const t of (a.definitions.declared || [])) what.append(el('p', t, 'hint'));
        for (const t of a.definitions.measured) what.append(el('p', t, 'hint'));
        ac.append(what);
    } catch { /* the panel is informational; a failed read shows nothing rather than zeros */ }

    // Training
    const tr = panel('Training', 'The Staffify sales playbook: the offer, who buys, discovery, the close and the objection bank.');
    try {
        const t = await get('/api/training-progress');
        const done = Object.values((t.me && t.me.done) || {}).filter(Boolean).length;
        tr.append(el('p', `${done} of 8 modules marked complete.`, 'hint'));
    } catch { /* progress is a nicety; the link is the point */ }
    tr.append(linkTo('Open the playbook', '/training/sales/', 'btn btn-ghost'));
})();
</script>
</body>
</html>
